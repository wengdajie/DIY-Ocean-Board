<!doctype html><meta charset="utf-8"><title>vis</title><body style="margin:0">
<iframe id="fr" src="../index.html" style="width:1500px;height:950px;border:0"></iframe>
<pre id="out">running</pre>
<script>
var L = [];
/* 主题色常量 —— UI 从深色改暖白后, 像素断言必须跟着主题走。
 * 这里集中登记 render.js 里真正用到的颜色, 断言引用常量语义而不是散落魔数,
 * 下次换主题只改这一处。 */
var THEME = {
  bg:        [247, 243, 234],   // --bg      画布/浮层底
  panel:     [255, 253, 248],   // --panel   视图格底
  sheet:     [247, 244, 236],   // --sheet   排样板材
  traceLine: [ 31, 138,  99],   // #1f8a63   描摹轮廓绿(暖白底上要够深才看得清)
  pocket:    [ 47, 143, 106],   // #2f8f6a   零件详图 pocket 绿
  part:      [ 47, 107, 176],   // #2f6bb0   零件/板 蓝
  sel:       [217, 138,  31]    // #d98a1f   选中橙
};
function chk(n, c, e) { L.push((c ? 'PASS ' : 'FAIL ') + n + (e !== undefined ? '  [' + e + ']' : '')); }
window.onload = function () {
  setTimeout(function () {
    var w = document.getElementById('fr').contentWindow, d = w.document;
    try {
      var G = w.G;
      // 用已知参数生成箱体
      /* 【第 9 轮改架】家具类型 chip 已并入结构配方, 顶部只剩 custom/image 两个。
       * selectModel('box') 保留了向后兼容: 等价于"配方模式 + 选中箱体柜 + 套推荐尺寸"。 */
      w.__app.selectModel('box');
      w.__app.showPane('nest');
      var st = w.__app.state;
      var res = w.Render.drawNest(d.getElementById('cvNest'), st.nest, { margin: 10 });
      chk('drawNest returns tf', !!res && res.sheetTf.length === st.nest.sheets.length, res ? res.sheetTf.length : 'null');

      var cv = d.getElementById('cvNest');
      var g = cv.getContext('2d');
      var r = Math.min(2, w.devicePixelRatio || 1);
      var img = g.getImageData(0, 0, cv.width, cv.height);
      function px(cssX, cssY) {
        var x = Math.round(cssX * r), y = Math.round(cssY * r);
        if (x < 0 || y < 0 || x >= cv.width || y >= cv.height) return null;
        var i = (y * cv.width + x) * 4;
        return [img.data[i], img.data[i + 1], img.data[i + 2], img.data[i + 3]];
      }
      function isSheet(c) { return c && c[0] > 230 && c[1] > 225 && c[2] > 210; }   // 米白板材
      function isPart(c) { return c && c[2] > c[0] + 20 && c[2] > 90; }              // 蓝色零件
      var tf = res.sheetTf[0], T = tf.T;

      // 1. 板材空白处应是米白色
      var so = w.__app.sheetOpts();
      var empty = px(T({ x: so.w - 4, y: so.h - 4 }).x, T({ x: so.w - 4, y: so.h - 4 }).y);
      chk('sheet background is board color', isSheet(empty), JSON.stringify(empty));

      // 2. 每个零件的几何中心(取轮廓内部一点)应是零件色
      var hits = 0, miss = [];
      st.nest.sheets[0].placements.forEach(function (pl) {
        var q = pl.part.transformed(pl.xf);
        var b = q.bbox();
        // 找一个确定在轮廓内、且不在孔内的点
        var found = null;
        for (var ty = 0.2; ty <= 0.8 && !found; ty += 0.1) {
          for (var tx = 0.2; tx <= 0.8 && !found; tx += 0.1) {
            var cand = { x: b.x0 + b.w * tx, y: b.y0 + b.h * ty };
            if (!G.pointInPoly(cand, G.flatten(q.outer, 0.5))) continue;
            var inHole = q.holes.some(function (h) { return G.pointInPoly(cand, G.flatten(h, 0.5)); });
            if (inHole) continue;
            found = cand;
          }
        }
        if (!found) { miss.push(pl.name + ':nopoint'); return; }
        var sc = T(found);
        var c = px(sc.x, sc.y);
        if (isPart(c)) hits++; else miss.push(pl.name + ':' + JSON.stringify(c));
      });
      chk('every placed part is painted at its interior', miss.length === 0 && hits === st.nest.sheets[0].placements.length,
        'hits=' + hits + '/' + st.nest.sheets[0].placements.length + ' miss=' + miss.slice(0, 3).join(','));

      // 3. 榫眼(孔)内部应是板材底色 —— 证明 evenodd 挖孔生效
      var holeOk = 0, holeBad = [];
      st.nest.sheets[0].placements.forEach(function (pl) {
        var q = pl.part.transformed(pl.xf);
        q.holes.forEach(function (h, hi) {
          var hb = G.loopBBox(h);
          if (hb.w * tf.scale < 4 || hb.h * tf.scale < 4) return;   // 太小的孔像素上看不出
          var ctr = { x: hb.cx, y: hb.cy };
          if (!G.pointInPoly(ctr, G.flatten(h, 0.3))) return;
          var sc = T(ctr);
          var c = px(sc.x, sc.y);
          if (isSheet(c)) holeOk++; else holeBad.push(pl.name + '#' + hi + ':' + JSON.stringify(c));
        });
      });
      chk('mortise holes are cut through (evenodd)', holeBad.length === 0 && holeOk > 0,
        'ok=' + holeOk + ' bad=' + holeBad.slice(0, 3).join(','));

      // 4. 板材外(留白外侧)不应有零件色
      var outside = px(T({ x: 2, y: 2 }).x, T({ x: 2, y: 2 }).y);
      chk('no part inside margin band', !isPart(outside), JSON.stringify(outside));

      // 5. 零件详图: 每个零件格内都应有绘制
      d.querySelector('.tab[data-pane="parts"]').click();
      var pres = w.Render.drawParts(d.getElementById('cvParts'), st.result.parts, {});
      chk('drawParts returns tf', pres && pres.tf.length === st.result.parts.length, pres ? pres.tf.length : 'null');
      var cv2 = d.getElementById('cvParts'), g2 = cv2.getContext('2d');
      var img2 = g2.getImageData(0, 0, cv2.width, cv2.height);
      function px2(cssX, cssY) {
        var x = Math.round(cssX * r), y = Math.round(cssY * r);
        if (x < 0 || y < 0 || x >= cv2.width || y >= cv2.height) return null;
        var i = (y * cv2.width + x) * 4;
        return [img2.data[i], img2.data[i + 1], img2.data[i + 2], img2.data[i + 3]];
      }
      var pmiss = [];
      pres.tf.forEach(function (o) {
        var b = o.part.bbox(), found = null;
        for (var ty = 0.3; ty <= 0.7 && !found; ty += 0.1) {
          for (var tx = 0.3; tx <= 0.7 && !found; tx += 0.1) {
            var cand = { x: b.x0 + b.w * tx, y: b.y0 + b.h * ty };
            if (!G.pointInPoly(cand, G.flatten(o.part.outer, 0.5))) continue;
            if (o.part.holes.some(function (h) { return G.pointInPoly(cand, G.flatten(h, 0.5)); })) continue;
            found = cand;
          }
        }
        if (!found) return;
        var sc = o.T(found), c = px2(sc.x, sc.y);
        // 详图用半透明蓝填充 + 蓝描边, alpha 必 >0 且偏蓝
        if (!(c && c[3] > 0 && c[2] >= c[0])) pmiss.push(o.part.name + ':' + JSON.stringify(c));
      });
      chk('each part drawn in its cell', pmiss.length === 0, pmiss.slice(0, 3).join(','));

      // 6. 3D 装配: 应有多种明暗面(证明立体感与背面剔除)
      d.querySelector('.tab[data-pane="asm"]').click();
      var cv3 = d.getElementById('cvAsm'), g3 = cv3.getContext('2d');
      var img3 = g3.getImageData(0, 0, cv3.width, cv3.height).data;
      var shades = {}, lit = 0;
      for (var i = 0; i < img3.length; i += 4 * 11) {
        if (img3[i + 3] < 250) continue;
        var rr = img3[i], gg = img3[i + 1], bb = img3[i + 2];
        if (rr === 15 && gg === 18 && bb === 22) continue;       // 背景
        // 木色系: r > g > b
        if (rr > gg && gg > bb && rr > 60) { lit++; shades[rr + ',' + gg + ',' + bb] = 1; }
      }
      chk('3D has wood-toned pixels', lit > 200, lit);
      chk('3D has multiple face shades', Object.keys(shades).length >= 3, Object.keys(shades).length);

      // 7. 旋转视角后画面应改变
      var before = g3.getImageData(0, 0, cv3.width, cv3.height).data;
      w.__app.state.view.asm.ang = 75;
      w.Render.drawAssembly(cv3, w.Render.boxesFrom(st.result.parts, { t: 15 }),
        { ang: 75, tilt: 0.55, zoom: 1 });
      var after = g3.getImageData(0, 0, cv3.width, cv3.height).data;
      var diff = 0;
      for (var k = 0; k < before.length; k += 4 * 23) if (before[k] !== after[k]) diff++;
      chk('3D responds to rotation', diff > 40, diff);

      // 8. 爆炸视图应改变画面
      var b2 = g3.getImageData(0, 0, cv3.width, cv3.height).data;
      w.Render.drawAssembly(cv3, w.Render.boxesFrom(st.result.parts, { t: 15 }),
        { ang: 75, tilt: 0.55, zoom: 1, explode: 0.5 });
      var a2 = g3.getImageData(0, 0, cv3.width, cv3.height).data;
      var d2 = 0;
      for (var k2 = 0; k2 < b2.length; k2 += 4 * 23) if (b2[k2] !== a2[k2]) d2++;
      chk('3D explode changes view', d2 > 40, d2);

      /* ================= 图片预览: 像素级断言 =================
       * 图片模式的关键交互是"用户看得见阈值切出了什么", 所以必须验到像素。
       * 不能只测"函数没报错"。
       */
      w.__app.selectModel('image');
      // 造一张确定的图: 白底 + 居中黑方块(像素坐标 100..200 / 60..140)
      var tcv = d.createElement('canvas'); tcv.width = 300; tcv.height = 200;
      var tg = tcv.getContext('2d');
      tg.fillStyle = '#fff'; tg.fillRect(0, 0, 300, 200);
      tg.fillStyle = '#000'; tg.fillRect(100, 60, 100, 80);
      var square = tg.getImageData(0, 0, 300, 200);
      w.__app.setImode('silhouette');
      d.getElementById('standStyle').value = 'none';
      d.getElementById('standStyle').dispatchEvent(new w.Event('change'));
      d.getElementById('targetWidth').value = 100;
      d.getElementById('targetHeight').value = 0;
      d.getElementById('targetWidth').dispatchEvent(new w.Event('change'));
      w.__app.setImage(square, 'square');
      w.__app.showPane('img');

      var ist = w.__app.state;
      chk('图片: 单零件', ist.result.parts.length === 1, ist.result.parts.length);
      chk('图片: 方块 4 个顶点', ist.result.parts[0].outer.length === 4, ist.result.parts[0].outer.length);
      chk('图片: 尺寸 100x80mm', Math.abs(ist.result.parts[0].bbox().w - 100) < 1 &&
        Math.abs(ist.result.parts[0].bbox().h - 80) < 1,
        G.round(ist.result.parts[0].bbox().w, 2) + 'x' + G.round(ist.result.parts[0].bbox().h, 2));
      chk('图片: 掩膜 bbox 对应源图方块', ist.image.maskBBox &&
        Math.abs(ist.image.maskBBox.x0 - 100) <= 1 && Math.abs(ist.image.maskBBox.y0 - 60) <= 1 &&
        Math.abs(ist.image.maskBBox.w - 100) <= 1 && Math.abs(ist.image.maskBBox.h - 80) <= 1,
        JSON.stringify(ist.image.maskBBox));

      var icv = d.getElementById('cvImg'), ig = icv.getContext('2d');
      var ir = Math.min(2, w.devicePixelRatio || 1);
      function ipx(iimg, cssX, cssY) {
        var x = Math.round(cssX * ir), y = Math.round(cssY * ir);
        if (x < 0 || y < 0 || x >= icv.width || y >= icv.height) return null;
        var i = (y * icv.width + x) * 4;
        return [iimg.data[i], iimg.data[i + 1], iimg.data[i + 2], iimg.data[i + 3]];
      }

      // ---- 'image' 模式: 源图原样, 方块中心应是黑, 角落应是白 ----
      var geo = w.Render.drawMaskPreview(icv, ist.image.data, ist.image.mask, { mode: 'image' });
      chk('预览返回几何', !!geo && geo.scale > 0, geo ? G.round(geo.scale, 3) : 'null');
      var im1 = ig.getImageData(0, 0, icv.width, icv.height);
      // 源图坐标 -> 画布 css 坐标
      function toCv(sx, sy) { return { x: geo.ox + sx * geo.scale, y: geo.oy + sy * geo.scale }; }
      var cIn = toCv(150, 100), cOut = toCv(20, 20);
      var pIn = ipx(im1, cIn.x, cIn.y), pOut = ipx(im1, cOut.x, cOut.y);
      chk('预览[原图]: 方块内是黑', pIn && pIn[0] < 60 && pIn[1] < 60 && pIn[2] < 60, JSON.stringify(pIn));
      chk('预览[原图]: 方块外是白', pOut && pOut[0] > 200 && pOut[1] > 200 && pOut[2] > 200, JSON.stringify(pOut));

      // ---- 'mask' 模式: 掩膜=1 画深色(30), =0 画浅色(245) ----
      w.Render.drawMaskPreview(icv, ist.image.data, ist.image.mask, { mode: 'mask' });
      var im2 = ig.getImageData(0, 0, icv.width, icv.height);
      var mIn = ipx(im2, cIn.x, cIn.y), mOut = ipx(im2, cOut.x, cOut.y);
      chk('预览[掩膜]: 内部深色', mIn && mIn[0] < 70, JSON.stringify(mIn));
      chk('预览[掩膜]: 外部浅色', mOut && mOut[0] > 200, JSON.stringify(mOut));

      // ---- 'overlay' 模式: 方块内应带蓝色叠加(b 明显 > r) ----
      w.Render.drawMaskPreview(icv, ist.image.data, ist.image.mask, { mode: 'overlay' });
      var im3 = ig.getImageData(0, 0, icv.width, icv.height);
      var oIn = ipx(im3, cIn.x, cIn.y), oOut = ipx(im3, cOut.x, cOut.y);
      chk('预览[叠加]: 内部偏蓝', oIn && oIn[2] > oIn[0] + 25, JSON.stringify(oIn));
      chk('预览[叠加]: 外部不偏蓝', oOut && oOut[2] <= oOut[0] + 12, JSON.stringify(oOut));

      // ---- 轮廓叠加: 绿色描边应落在掩膜 bbox 的边界上 ----
      w.Render.drawMaskPreview(icv, ist.image.data, ist.image.mask, {
        mode: 'overlay', parts: ist.result.parts, traceRect: ist.image.maskBBox
      });
      var im4 = ig.getImageData(0, 0, icv.width, icv.height);
      /* 描摸轮廓绿(THEME.traceLine = #1f8a63)会与蓝色掩膜叠加抗锯齿混合
       * (实测 31,131,99), 所以判据不能钉死绝对亮度——只要求"绿通道占主导且远高于红"。
       * 阈值从主题常量推导: 混合后 g 至少不会低于原色 g 的 60%。 */
      var GMIN = THEME.traceLine[1] * 0.6;
      function isGreen(c) { return c && c[1] > GMIN && c[1] > c[0] + 50 && c[1] > c[2] + 20; }
      function hasGreenNear(sx, sy, rad) {
        var c0 = toCv(sx, sy);
        for (var dy = -rad; dy <= rad; dy++) {
          for (var dx = -rad; dx <= rad; dx++) {
            if (isGreen(ipx(im4, c0.x + dx, c0.y + dy))) return true;
          }
        }
        return false;
      }
      chk('轮廓叠加: 上边有绿线', hasGreenNear(150, 60, 5));
      chk('轮廓叠加: 下边有绿线', hasGreenNear(150, 140, 5));
      chk('轮廓叠加: 左边有绿线', hasGreenNear(100, 100, 5));
      chk('轮廓叠加: 右边有绿线', hasGreenNear(200, 100, 5));
      chk('轮廓叠加: 方块中心无绿线', !hasGreenNear(150, 100, 3));
      chk('轮廓叠加: 远处背景无绿线', !hasGreenNear(30, 30, 4));

      // ---- 带孔形状: 孔的轮廓也要画出来 ----
      var hcv = d.createElement('canvas'); hcv.width = 200; hcv.height = 200;
      var hg = hcv.getContext('2d');
      hg.fillStyle = '#fff'; hg.fillRect(0, 0, 200, 200);
      hg.fillStyle = '#000'; hg.fillRect(40, 40, 120, 120);
      hg.fillStyle = '#fff'; hg.fillRect(80, 80, 40, 40);
      w.__app.setImage(hg.getImageData(0, 0, 200, 200), 'holed');
      var hst = w.__app.state;
      chk('带孔图: 1 件 1 孔', hst.result.parts.length === 1 && hst.result.parts[0].holes.length === 1,
        hst.result.parts.length + '/' + (hst.result.parts[0] ? hst.result.parts[0].holes.length : 0));
      var geo2 = w.Render.drawMaskPreview(icv, hst.image.data, hst.image.mask, {
        mode: 'overlay', parts: hst.result.parts, traceRect: hst.image.maskBBox
      });
      var im5 = ig.getImageData(0, 0, icv.width, icv.height);
      function green2(sx, sy, rad) {
        for (var dy = -rad; dy <= rad; dy++) {
          for (var dx = -rad; dx <= rad; dx++) {
            var x = Math.round((geo2.ox + sx * geo2.scale + dx) * ir), y = Math.round((geo2.oy + sy * geo2.scale + dy) * ir);
            if (x < 0 || y < 0 || x >= icv.width || y >= icv.height) continue;
            var i = (y * icv.width + x) * 4;
            if (isGreen([im5.data[i], im5.data[i + 1], im5.data[i + 2]])) return true;
          }
        }
        return false;
      }
      chk('带孔图: 孔的上边有绿线', green2(100, 80, 5));
      chk('带孔图: 孔的左边有绿线', green2(80, 100, 5));
      chk('带孔图: 孔中心无绿线', !green2(100, 100, 3));

      // ---- 空图片: 应画提示文字而不是崩 ----
      var ecv = d.createElement('canvas'); ecv.width = 400; ecv.height = 200;
      var eres = w.Render.drawMaskPreview(ecv, null, null, { emptyText: 'NOIMAGE' });
      chk('空图预览返回 null', eres === null);
      var eg = ecv.getContext('2d').getImageData(0, 0, ecv.width, ecv.height).data;
      var textPx = 0;
      for (var ei = 0; ei < eg.length; ei += 4) if (eg[ei] > 90) textPx++;
      chk('空图预览画了提示文字', textPx > 30, textPx);

      // ---- 分层模式预览也要能画 ----
      w.__app.setImode('layers');
      var lcv = d.createElement('canvas'); lcv.width = 240; lcv.height = 240;
      var lg = lcv.getContext('2d');
      lg.fillStyle = '#fff'; lg.fillRect(0, 0, 240, 240);
      [['#d0d0d0', 100], ['#909090', 70], ['#404040', 40], ['#000', 18]].forEach(function (lv) {
        lg.fillStyle = lv[0]; lg.beginPath(); lg.arc(120, 120, lv[1], 0, 7); lg.fill();
      });
      w.__app.setImage(lg.getImageData(0, 0, 240, 240), 'ramp');
      chk('分层: 生成多层', w.__app.state.result.parts.length >= 4, w.__app.state.result.parts.length);
      w.Render.drawMaskPreview(icv, w.__app.state.image.data, w.__app.state.image.mask, { mode: 'overlay' });
      var im6 = ig.getImageData(0, 0, icv.width, icv.height);
      var blueish = 0;
      for (var bi = 0; bi < im6.data.length; bi += 4 * 13) {
        if (im6.data[bi + 2] > im6.data[bi] + 25 && im6.data[bi + 3] > 250) blueish++;
      }
      chk('分层预览有掩膜叠加', blueish > 30, blueish);

      /* ================= 自定义(重构版)渲染 ================= */
      // ---- A. 清单模式: pocket 虚线绿 + 纹理平行线 ----
      w.__app.selectModel('custom');
      w.__app.setCmode('list');
      var cst = w.__app.state;
      cst.rows = [
        { name: '带槽面板', len: 600, wid: 400, qty: 1, grain: 'long',
          pockets: [{ ref: 'center', x: 0, y: 0, w: 300, h: 120, depth: 6 }] }
      ];
      /* 这里验证纹理线的渲染方向，主动锁定纹理，避免被默认的最大利用率旋转策略干扰。 */
      d.getElementById('respectGrain').checked = true;
      d.getElementById('respectGrain').dispatchEvent(new w.Event('change'));
      w.__app.generate();
      chk('清单模式出 1 件带 pocket', cst.result.parts.length === 1 && cst.result.parts[0].pockets.length === 1,
        cst.result.parts.length + '/' + (cst.result.parts[0] ? cst.result.parts[0].pockets.length : 0));

      d.querySelector('.tab[data-pane="nest"]').click();
      var ncv = d.getElementById('cvNest');
      var nres = w.Render.drawNest(ncv, cst.nest, { margin: 10 });
      var ng = ncv.getContext('2d');
      var nim = ng.getImageData(0, 0, ncv.width, ncv.height);
      function npx(cssX, cssY) {
        var x = Math.round(cssX * r), y = Math.round(cssY * r);
        if (x < 0 || y < 0 || x >= ncv.width || y >= ncv.height) return null;
        var i = (y * ncv.width + x) * 4;
        return [nim.data[i], nim.data[i + 1], nim.data[i + 2], nim.data[i + 3]];
      }
      // pocket 填充 rgba(18,160,106,.18) 叠在零件蓝上 => 绿通道要明显抬起来
      function isPocketGreen(c) { return c && c[1] > c[0] + 18 && c[1] > 70 && c[2] < c[1] + 40; }
      var ntf = nres.sheetTf[0], NT = ntf.T;
      var pl0 = cst.nest.sheets[0].placements[0];
      var q0 = pl0.part.transformed(pl0.xf);
      var pkb = G.loopBBox(q0.pockets[0].loop);
      var pkc = NT({ x: pkb.cx, y: pkb.cy });
      chk('排样图: pocket 内部呈绿色调(与切透孔区分)', isPocketGreen(npx(pkc.x, pkc.y)), JSON.stringify(npx(pkc.x, pkc.y)));

          /* 存的是上次大窗口的值(比如 1200px 宽的侧栏) → 读回必须重新夹,
           * 否则小窗口下侧栏会把整个图纸区吃掉, 而且没地方能拖回来。 */
          w.localStorage.setItem(A.LAYOUT_KEY, JSON.stringify({ side: 4000, plan: 300 }));
          A.loadLayout(); A.applyLayout();
          chk('布局[持久化]: 读回的超大旧值被重新夹紧(不会吃掉图纸区)',
            side.clientWidth <= Math.min(560, Math.round(w.innerWidth * 0.5)) + 2 && A.layout.plan < 100,
            side.clientWidth + ' / ' + A.layout.plan);
          /* localStorage 里是垃圾也不能白屏 */
          w.localStorage.setItem(A.LAYOUT_KEY, '{bad json');
          chk('布局[持久化]: 坏数据不抛异常', (function () {
            try { A.loadLayout(); A.applyLayout(); return true; } catch (e) { return false; }
          })());
          w.localStorage.removeItem(A.LAYOUT_KEY);
          A.resetLayout();
        })();

        w.__app.setCmode('list');
        w.__app.showPane('nest');
      })();

      w.__app.selectModel('box');
    } catch (e) {
      chk('exception', false, e.message + ' @ ' + (e.stack || '').split('\n')[1]);
    }
    var fails = L.filter(function (s) { return s.indexOf('FAIL') === 0; }).length;
    document.getElementById('out').textContent = L.join('\n') + '\n---\nTOTAL ' + L.length + '  FAILS ' + fails;
  }, 1300);
};
</script>
