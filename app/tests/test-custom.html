<!doctype html><meta charset="utf-8"><body><pre id="out">running</pre>
<script src="../js/geom.js"></script><script src="../js/joints.js"></script>
<script src="../js/part.js"></script><script src="../js/models.js"></script>
<script src="../js/imagetrace.js"></script><script src="../js/imagemodel.js"></script>
<script src="../js/features.js"></script><script src="../js/custom.js"></script>
<script src="../js/cutlist.js"></script><script src="../js/nest.js"></script>
<script src="../js/render.js"></script>
<script>
var L = [];
function chk(n, c, e) { L.push((c ? 'PASS ' : 'FAIL ') + n + (e !== undefined ? '  [' + e + ']' : '')); }
function near(a, b, t) { return Math.abs(a - b) < (t || 1e-6); }
function mk(w, h, draw) {
  var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  var g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#000'; draw(g);
  return g.getImageData(0, 0, w, h);
}
function errsOf(parts) {
  var e = [];
  parts.forEach(function (p) { p.validate().forEach(function (m) { if (m.level === 'error') e.push(p.name + ':' + m.text); }); });
  return e;
}
try {
/* =========== A. Custom.intersect 空间求解 =========== */
var t = 15;
var side = { plane: 'YZ', at: t / 2, u0: 0, u1: 300, v0: 0, v1: 700 };
var shelf = { plane: 'XY', at: 350, u0: t, u1: 585, v0: 0, v1: 300 };
var it = Custom.intersect(shelf, side, t);
chk('层板×侧板 相交', !!it, it ? it.axis + ' ' + JSON.stringify(it.range.map(function (v) { return G.round(v, 2); })) : 'null');
chk('交线沿 y(深度)', it && it.axis === 'y', it && it.axis);
var far = { plane: 'XY', at: 350, u0: 500, u1: 585, v0: 0, v1: 300 };
chk('不相交返回 null', Custom.intersect(far, side, t) === null);
chk('同平面返回 null', Custom.intersect(shelf, { plane: 'XY', at: 100, u0: 0, u1: 100, v0: 0, v1: 100 }, t) === null);

/* =========== B. Custom.build 基础柜 =========== */
var r = Custom.build({
  thickness: t, fit: 0.2, tenonCount: 3,
  panels: [
    { id: 'L', name: '左侧板', plane: 'YZ', at: t / 2, u0: 0, u1: 300, v0: 0, v1: 700 },
    { id: 'R', name: '右侧板', plane: 'YZ', at: 600 - t / 2, u0: 0, u1: 300, v0: 0, v1: 700 },
    { id: 'B', name: '底板', plane: 'XY', at: t / 2, u0: t, u1: 600 - t, v0: 0, v1: 300 },
    { id: 'T', name: '顶板', plane: 'XY', at: 700 - t / 2, u0: t, u1: 600 - t, v0: 0, v1: 300 },
    { id: 'S', name: '层板', plane: 'XY', at: 350, u0: t, u1: 600 - t, v0: 0, v1: 300 }
  ]
});
chk('build 生成 5 块板', r.parts.length === 5, r.parts.map(function (p) { return p.name; }).join('/'));
chk('build 求出榫接', r.info.tenonJoints > 0, JSON.stringify(r.info));
chk('build 零件全部合法', errsOf(r.parts).length === 0, errsOf(r.parts).slice(0, 3).join(' | '));
var byName = {}; r.parts.forEach(function (p) { byName[p.name] = p; });
chk('侧板有榫眼', byName['左侧板'].holes.length > 0, byName['左侧板'].holes.length);
chk('层板出了榫(宽度>净宽)', byName['层板'].bbox().w > 600 - 2 * t, G.round(byName['层板'].bbox().w, 1));
chk('层板榫头长=板厚(两侧共+2t)', near(byName['层板'].bbox().w, 600 - 2 * t + 2 * t, 1e-6), G.round(byName['层板'].bbox().w, 2));
// 榫眼宽度应为 t+fit
var mh = G.loopBBox(byName['左侧板'].holes[0]);
chk('榫眼厚度方向 = t+fit', near(Math.min(mh.w, mh.h), t + 0.2, 1e-6), G.round(Math.min(mh.w, mh.h), 3));

/* =========== C. 榫与眼真实对位(自定义结构) =========== */
// 层板画布 x = 世界u - u0(=t); 右侧板画布 x = 世界y(深度) - u0(=0)
// 层板右边榫头的外端面在 x = (585-15) + t = 585, 与右侧板榫眼的画布 x 同为"深度"坐标 => 可直接比
// 注意: 不用扫描线量榫头(量化误差 ±0.15mm 远大于 fit/2=0.1mm), 直接取顶点精确值。
function faceSpans(loop, axis, faceVal, tol) {
  tol = tol || 1e-6;
  var oth = axis === 'x' ? 'y' : 'x';
  var out = [];
  for (var i = 0; i < loop.length; i++) {
    var a = loop[i], b = loop[(i + 1) % loop.length];
    if (Math.abs(a[axis] - faceVal) > tol || Math.abs(b[axis] - faceVal) > tol) continue;
    if (a.b) continue;                                  // 只认直线段
    var lo = Math.min(a[oth], b[oth]), hi = Math.max(a[oth], b[oth]);
    if (hi - lo > 1e-6) out.push([lo, hi]);
  }
  return out.sort(function (p, q) { return p[0] - q[0]; });
}
var sh = byName['层板'], rs = byName['右侧板'];
var shTabs = faceSpans(sh.outer, 'x', (600 - 2 * t) + t, 1e-6);
var rsHoles = rs.holes.map(function (h) { return G.loopBBox(h); })
  .filter(function (b) { return near(Math.min(b.w, b.h), t + 0.2, 0.01); })
  .sort(function (a, b) { return a.x0 - b.x0; });
chk('层板右边有榫头', shTabs.length > 0, shTabs.length + ' ' + JSON.stringify(shTabs.map(function (g) { return [G.round(g[0], 3), G.round(g[1], 3)]; })));
chk('右侧板有对应榫眼', rsHoles.length >= shTabs.length, rsHoles.length);
// 榫头本身应被两侧各收窄 fit/4 => 净宽 = span - fit/2
var mateOk = 0, why = [];
shTabs.forEach(function (tb) {
  var found = rsHoles.filter(function (h) { return tb[0] > h.x0 - 1 && tb[1] < h.x1 + 1; })[0];
  if (!found) { why.push('榫[' + G.round(tb[0], 2) + ',' + G.round(tb[1], 2) + ']无眼'); return; }
  var c0 = tb[0] - found.x0, c1 = found.x1 - tb[1];
  if (near(c0, 0.1, 0.01) && near(c1, 0.1, 0.01)) mateOk++;
  else why.push('间隙' + G.round(c0, 4) + '/' + G.round(c1, 4));
});
chk('自定义结构: 榫与眼逐个对位(单侧间隙 fit/2)', mateOk === shTabs.length && shTabs.length > 0 && !why.length, mateOk + '/' + shTabs.length + ' ' + why.slice(0, 2).join(';'));
// 总配合间隙 = fit (两侧之和), 这是"能敲进去且不晃"的关键
var totOk = shTabs.every(function (tb) {
  var h = rsHoles.filter(function (q) { return tb[0] > q.x0 - 1 && tb[1] < q.x1 + 1; })[0];
  return h && near((h.x1 - h.x0) - (tb[1] - tb[0]), 0.2, 0.01);
});
chk('自定义结构: 总配合间隙 = fit', totOk && shTabs.length > 0,
  shTabs.length ? G.round((rsHoles[0].x1 - rsHoles[0].x0) - (shTabs[0][1] - shTabs[0][0]), 4) : 'n/a');
// 榫头长度 = 板厚(通榫齐平)
chk('榫头长度 = 板厚', near(sh.bbox().x1 - (600 - 2 * t), t, 1e-6), G.round(sh.bbox().x1 - (600 - 2 * t), 4));

/* =========== D. shelfUnit 不规则格柜 =========== */
var su = Custom.shelfUnit({
  thickness: 15, width: 900, depth: 320, height: 900,
  dividers: [300, 600], shelvesPerBay: [2, 1, 3], fit: 0.2
});
chk('shelfUnit 板数 = 4框+2隔+6层', su.parts.length === 4 + 2 + 6, su.parts.length);
chk('shelfUnit 全部合法', errsOf(su.parts).length === 0, errsOf(su.parts).slice(0, 3).join(' | '));
chk('shelfUnit 有榫接', su.info.tenonJoints >= 6, su.info.tenonJoints);
chk('shelfUnit 各列层板数不同', su.parts.filter(function (p) { return /层板1-/.test(p.name); }).length === 2 &&
  su.parts.filter(function (p) { return /层板2-/.test(p.name); }).length === 1 &&
  su.parts.filter(function (p) { return /层板3-/.test(p.name); }).length === 3, su.parts.map(function (p) { return p.name; }).join(','));
// 排样可用
var nn = Nest.nest(su.parts.map(function (p) { return { part: p, qty: 1 }; }), { w: 2440, h: 1220, margin: 10, gap: 6 });
chk('shelfUnit 可排样', Nest.verify(nn, { margin: 10 }).length === 0 && nn.oversize.length === 0, 'sheets=' + nn.sheets.length);
chk('shelfUnit 可导出 DXF', CAD.toDXF(su.parts.map(function (p) { return { part: p }; })).indexOf('EOF') > 0);
// 少于 2 块板应报错
chk('板数不足报错', Custom.build({ thickness: 15, panels: [{ plane: 'XY', at: 0, u0: 0, u1: 100, v0: 0, v1: 100 }] }).warnings.some(function (m) { return m.level === 'error'; }));
chk('未知平面被拒', Custom.build({ thickness: 15, panels: [{ plane: 'ZZ', at: 0, u0: 0, u1: 100, v0: 0, v1: 100 }, { plane: 'XY', at: 0, u0: 0, u1: 100, v0: 0, v1: 100 }] }).warnings.some(function (m) { return /未知平面/.test(m.text); }));

/* =========== E. 图片 -> 轮廓件 =========== */
var star = mk(300, 300, function (g) {
  g.beginPath();
  for (var k = 0; k < 10; k++) {
    var a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 55 : 130;
    var x = 150 + rr * Math.cos(a), y = 150 + rr * Math.sin(a);
    k ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath(); g.fill();
});
var si = ImageModel.silhouette(star, { thickness: 12, targetWidth: 240, fit: 0.2, simplify: 1.0 });
chk('轮廓件生成 1 件', si.parts.length === 1, si.parts.length);
chk('轮廓件合法', errsOf(si.parts).length === 0, errsOf(si.parts).slice(0, 2).join('|'));
chk('轮廓件宽度 = targetWidth', near(si.parts[0].bbox().w, 240, 1.5), G.round(si.parts[0].bbox().w, 2));
chk('五角星顶点数合理(10~40)', si.parts[0].outer.length >= 10 && si.parts[0].outer.length <= 40, si.parts[0].outer.length);
chk('轮廓件 info', si.info.mode === '轮廓件' && si.info.pxPerMM > 0, JSON.stringify(si.info));

// 等比缩放: 同时给宽高取小者
var si2 = ImageModel.silhouette(star, { thickness: 12, targetWidth: 400, targetHeight: 100 });
chk('等比缩放取小者', near(si2.parts[0].bbox().h, 100, 2), G.round(si2.parts[0].bbox().h, 1));

// 带孔图形: 甜甜圈
var donut = mk(200, 200, function (g) {
  g.beginPath(); g.arc(100, 100, 80, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(100, 100, 35, 0, 7); g.fill();
});
var di = ImageModel.silhouette(donut, { thickness: 12, targetWidth: 160 });
chk('甜甜圈: 1 件带 1 孔', di.parts.length === 1 && di.parts[0].holes.length === 1,
  di.parts.length + '件/' + (di.parts[0] ? di.parts[0].holes.length : 0) + '孔');
chk('甜甜圈孔方向 CW', di.parts[0].holes.length && G.loopArea(di.parts[0].holes[0]) < 0);
var dArea = Math.abs(di.parts[0].area());
var dTrue = Math.PI * (80 * 80 - 35 * 35) * Math.pow(160 / 160, 2);
chk('甜甜圈净面积合理', Math.abs(dArea - dTrue) / dTrue < 0.06, G.round(dArea, 0) + ' vs ' + G.round(dTrue, 0));

// 自动榫头 + 底座
var tree = mk(200, 260, function (g) {
  g.beginPath(); g.moveTo(100, 10); g.lineTo(170, 190); g.lineTo(30, 190); g.closePath(); g.fill();
  g.fillRect(85, 190, 30, 60);   // 树干(着地)
});
var ti = ImageModel.silhouette(tree, {
  thickness: 12, targetHeight: 300, standStyle: 'tenon', fit: 0.2, tenonWidth: 30, baseDepth: 80
});
chk('带底座: 2 件', ti.parts.length === 2, ti.parts.map(function (p) { return p.name; }).join('/'));
chk('底座在最后', ti.parts[ti.parts.length - 1].name === '底座');
chk('生成了榫头', ti.info.tenons > 0, ti.info.tenons);
chk('底座有榫眼', ti.parts[1].holes.length === ti.info.tenons, ti.parts[1].holes.length);
chk('带底座零件全合法', errsOf(ti.parts).length === 0, errsOf(ti.parts).slice(0, 2).join('|'));
// 榫眼宽 = t + fit
var bh = G.loopBBox(ti.parts[1].holes[0]);
chk('底座榫眼厚度 = t+fit', near(Math.min(bh.w, bh.h), 12 + 0.2, 0.01), G.round(Math.min(bh.w, bh.h), 3));
// 轮廓件底部应伸出榫头(超过主体最低点)
chk('轮廓件含榫头凸起', ti.parts[0].outer.length > 4);

// 反相
var invImg = mk(120, 120, function (g) { g.fillRect(0, 0, 120, 120); g.fillStyle = '#fff'; g.fillRect(30, 30, 60, 60); });
var iv = ImageModel.silhouette(invImg, { thickness: 12, targetWidth: 100, invert: true });
chk('invert 提取白色区域', iv.parts.length === 1 && near(iv.parts[0].bbox().w, 100, 2), iv.parts.length + ' ' + (iv.parts[0] ? G.round(iv.parts[0].bbox().w, 1) : ''));
// 空白图报错
chk('空白图报错', ImageModel.silhouette(mk(80, 80, function () { }), { thickness: 12 }).warnings.some(function (m) { return m.level === 'error'; }));
// 多形状限制
var many = mk(400, 100, function (g) { for (var k = 0; k < 6; k++) g.fillRect(10 + k * 60, 20, 40, 60); });
var mi = ImageModel.silhouette(many, { thickness: 12, targetWidth: 380, maxParts: 3 });
chk('maxParts 限制件数', mi.parts.length === 3, mi.parts.length);
chk('超出时给出提示', mi.warnings.some(function (m) { return /只保留最大/.test(m.text); }));

/* =========== F. 图片 -> 等高分层 =========== */
var ramp = mk(200, 200, function (g) {
  // 同心方块: 越里越黑 -> 应分出层层缩小的台阶
  g.fillStyle = '#e0e0e0'; g.fillRect(20, 20, 160, 160);
  g.fillStyle = '#909090'; g.fillRect(50, 50, 100, 100);
  g.fillStyle = '#404040'; g.fillRect(75, 75, 50, 50);
  g.fillStyle = '#000';    g.fillRect(90, 90, 20, 20);
});
var la = ImageModel.layers(ramp, { thickness: 9, layerCount: 4, targetWidth: 200, invert: false, pinDia: 0 });
chk('分层生成零件', la.parts.length >= 4, la.parts.length + ' ' + la.parts.map(function (p) { return p.name; }).join(','));
chk('分层零件合法', errsOf(la.parts).length === 0, errsOf(la.parts).slice(0, 3).join('|'));
chk('分层 info', la.info.mode === '等高分层' && la.info.layerCount === 4, JSON.stringify(la.info));
chk('总高 = 层数 x 板厚', near(la.info.totalHeight, 36, 1e-9), la.info.totalHeight);
// 面积应逐层递减(台阶)
var byLayer = {};
la.parts.forEach(function (p) {
  var m = p.name.match(/第(\d+)层/);
  if (m) byLayer[m[1]] = (byLayer[m[1]] || 0) + Math.abs(p.area());
});
var keys = Object.keys(byLayer).sort(function (a, b) { return a - b; });
var mono = true, seq = [];
keys.forEach(function (k, i) {
  seq.push(G.round(byLayer[k], 0));
  if (i && byLayer[k] > byLayer[keys[i - 1]] + 1) mono = false;
});
chk('各层面积逐层递减(台阶形)', mono && keys.length >= 3, seq.join(' > '));
// 对位销孔
var lp = ImageModel.layers(ramp, { thickness: 9, layerCount: 3, targetWidth: 200, pinDia: 6 });
var pinned = lp.parts.filter(function (p) {
  return p.holes.some(function (h) { var b = G.loopBBox(h); return near(b.w, 6.2, 0.3) && near(b.h, 6.2, 0.3); });
});
chk('分层生成对位销孔', pinned.length === lp.parts.length, pinned.length + '/' + lp.parts.length);
chk('销孔零件仍合法', errsOf(lp.parts).length === 0, errsOf(lp.parts).slice(0, 2).join('|'));
chk('分层可排样与导出', (function () {
  var n2 = Nest.nest(lp.parts.map(function (p) { return { part: p, qty: 1 }; }), { w: 2440, h: 1220, margin: 10, gap: 6 });
  return Nest.verify(n2, { margin: 10 }).length === 0 && CAD.toDXF(lp.parts.map(function (p) { return { part: p }; })).indexOf('EOF') > 0;
})());
chk('分层空图报错', ImageModel.layers(mk(60, 60, function () { }), { thickness: 9 }).warnings.some(function (m) { return m.level === 'error'; }));

/* =========== G. Feat 加工特征 =========== */
// G1 洞洞板阵列
var pb = Feat.pegboard(400, 300, { dia: 12, pitch: 40, margin: 30 });
chk('洞洞板 行列/孔数', pb.cols === 9 && pb.rows === 6 && pb.count === 54, pb.cols + 'x' + pb.rows + '=' + pb.count);
var pbb = pb.holes.map(function (l) { return G.loopBBox(l); });
var pxs = pbb.map(function (b) { return b.x0; }), pxe = pbb.map(function (b) { return b.x1; });
var pys = pbb.map(function (b) { return b.y0; }), pye = pbb.map(function (b) { return b.y1; });
chk('洞洞板阵列左右居中',
  near(Math.min.apply(null, pxs), 400 - Math.max.apply(null, pxe), 1e-6),
  G.round(Math.min.apply(null, pxs), 4) + ' vs ' + G.round(400 - Math.max.apply(null, pxe), 4));
chk('洞洞板阵列上下居中',
  near(Math.min.apply(null, pys), 300 - Math.max.apply(null, pye), 1e-6),
  G.round(Math.min.apply(null, pys), 4) + ' vs ' + G.round(300 - Math.max.apply(null, pye), 4));
chk('洞洞板孔全为 CW(内孔)', pb.holes.every(function (l) { return G.loopArea(l) < 0; }));
chk('洞洞板留边过大 -> 0 孔', Feat.pegboard(400, 300, { dia: 12, pitch: 40, margin: 190 }).count === 0,
  Feat.pegboard(400, 300, { dia: 12, pitch: 40, margin: 190 }).count);
chk('洞洞板孔距太密报警', Feat.pegboard(400, 300, { dia: 12, pitch: 13 }).warnings.some(function (m) { return /崩边/.test(m.text); }));
// 孔距翻倍 -> 孔数应显著减少(用户改孔距要看得见变化)
var pbA = Feat.pegboard(600, 400, { dia: 10, pitch: 30, margin: 20 });
var pbB = Feat.pegboard(600, 400, { dia: 10, pitch: 60, margin: 20 });
chk('孔距翻倍孔数约 1/4', pbB.count < pbA.count / 3, pbA.count + ' -> ' + pbB.count);
// 错排: 奇数行少一个孔, 且仍左右对称
var pst = Feat.pegboard(400, 300, { dia: 10, pitch: 40, margin: 30, stagger: true });
var row2 = pst.positions.filter(function (q) { return q.row === 2; });
var row1 = pst.positions.filter(function (q) { return q.row === 1; });
chk('错排奇数行少 1 孔', row2.length === row1.length - 1, row1.length + '/' + row2.length);
chk('错排仍左右对称',
  near(row2[0].x - Math.min.apply(null, row1.map(function (q) { return q.x; })),
       Math.max.apply(null, row1.map(function (q) { return q.x; })) - row2[row2.length - 1].x, 1e-6));
// 局部删孔
var pskip = Feat.pegboard(400, 300, { dia: 12, pitch: 40, margin: 30, skip: [[1, 1], [2, 3]] });
chk('skip 删指定孔', pskip.count === pb.count - 2, pskip.count);

// G2 四角处理: 面积不变量 + 顺序关系
var A0 = 200 * 100;
var rr = Feat.panelOutline(200, 100, { corners: { all: { type: 'round', size: 10 } } });
chk('圆角面积 = A-4(s²-πs²/4)', near(G.loopArea(rr), A0 - 4 * (100 - Math.PI * 25), 1e-6), G.round(G.loopArea(rr), 4));
var nn2 = Feat.panelOutline(200, 100, { corners: { all: { type: 'notch', size: 10 } } });
chk('方角切口面积 = A-4s²', near(G.loopArea(nn2), A0 - 4 * 100, 1e-6), G.round(G.loopArea(nn2), 4));
var cf = Feat.panelOutline(200, 100, { corners: { all: { type: 'chamfer', size: 10 } } });
chk('斜角面积 = A-4·s²/2', near(G.loopArea(cf), A0 - 4 * 50, 1e-6), G.round(G.loopArea(cf), 4));
chk('去料量 notch > chamfer > round',
  G.loopArea(nn2) < G.loopArea(cf) && G.loopArea(cf) < G.loopArea(rr),
  [G.round(G.loopArea(nn2), 1), G.round(G.loopArea(cf), 1), G.round(G.loopArea(rr), 1)].join(' < '));
chk('四角轮廓 CCW 且不自交',
  [rr, nn2, cf].every(function (l) { return G.loopArea(l) > 0 && !G.selfIntersects(l); }));
// 只处理单角
var one = Feat.panelOutline(200, 100, { corners: { tr: { type: 'notch', size: 20 } } });

/* =========== N. 世界尺寸盒互转（板位表"人话"坐标的地基） ===========
 * 板位表对外只暴露 6 个数: 位置(左起X/前起Y/离地Z) + 尺寸(宽W/深D/高H)。
 * 内部仍是 {plane,at,u0,u1,v0,v1}。这层互转错了, 用户填的每个数都会跑偏,
 * 所以必须逐 plane 验证**往返恒等**。 */
var BT = 18;
['XY', 'YZ', 'XZ'].forEach(function (pl) {
  var ax = Custom.thickAxis(pl);
  chk('thickAxis(' + pl + ')=' + ax, ax === { XY: 'z', YZ: 'x', XZ: 'y' }[pl], ax);

  // 造一块该朝向的板, 读盒 -> 写回 -> 再读盒, 必须完全一样
  var p0 = { id: 'bx', name: 'bx', plane: pl, at: 123, u0: 40, u1: 340, v0: 60, v1: 560 };
  var b1 = Custom.panelBox(p0, BT);
  chk('panelBox(' + pl + ') 六个数都是有限值', b1 && ['x', 'y', 'z', 'w', 'd', 'h'].every(function (k) {
    return isFinite(b1[k]);
  }), JSON.stringify(b1));
  // 厚度轴上的边长恒 = 板厚
  var tk = { x: 'w', y: 'd', z: 'h' }[ax];
  chk('panelBox(' + pl + ') 厚度轴边长=板厚', near(b1[tk], BT, 1e-9), b1[tk]);
  // 另两个轴的边长 = u/v 跨度
  var others = ['w', 'd', 'h'].filter(function (k) { return k !== tk; }).map(function (k) { return b1[k]; }).sort(function (a, b) { return a - b; });
  chk('panelBox(' + pl + ') 另两轴=u/v 跨度', near(others[0], 300, 1e-9) && near(others[1], 500, 1e-9), others.join('/'));

  // 往返恒等
  var p1 = { id: 'bx', name: 'bx', plane: pl, at: 0, u0: 0, u1: 0, v0: 0, v1: 0 };
  Custom.setPanelBox(p1, b1, BT);
  chk('setPanelBox(' + pl + ') 往返恒等 at', near(p1.at, p0.at, 1e-9), p1.at + ' vs ' + p0.at);
  chk('setPanelBox(' + pl + ') 往返恒等 u/v', near(p1.u0, p0.u0, 1e-9) && near(p1.u1, p0.u1, 1e-9) &&
    near(p1.v0, p0.v0, 1e-9) && near(p1.v1, p0.v1, 1e-9),
    [p1.u0, p1.u1, p1.v0, p1.v1].join(','));
  var b2 = Custom.panelBox(p1, BT);
  chk('panelBox(' + pl + ') 二次读盒一致', ['x', 'y', 'z', 'w', 'd', 'h'].every(function (k) {
    return near(b1[k], b2[k], 1e-9);
  }), JSON.stringify(b2));

  // isThickField: 恰有一个尺寸字段被锁
  var locked = ['w', 'd', 'h'].filter(function (f) { return Custom.isThickField(f, pl); });
  chk('isThickField(' + pl + ') 恰锁 1 个尺寸列', locked.length === 1 && locked[0] === tk, locked.join(','));
  chk('isThickField(' + pl + ') 位置列都不锁', ['x', 'y', 'z'].every(function (f) {
    return !Custom.isThickField(f, pl);
  }));
});

  /* \u76f4\u63a5\u91cf\u51e0\u4f55: \u5e26\u5f27\u7684\u6837\u5f0f\u5728**\u953c\u50cf\u8fb9**(bench \u7684\u677f\u817f\u4e0a\u8fb9\u5c31\u662f top \u8fb9)
   * \u4e0a\u4e0d\u5f97\u628a\u8f6e\u5ed3\u5f80\u6750\u6599\u5185\u90e8\u51f9\u8fdb\u53bb\u3002 */
  ['finger', 'round', 'fillet', 'mitre'].forEach(function (stk) {
    var u = Custom.recipeUnit('bench', {
      thickness: 15, width: 1200, depth: 350, height: 450, fit: 0.2, jointStyle: stk
    });
    var leg = u.parts.filter(function (p) { return p.name.indexOf('\u5de6\u677f\u817f') >= 0; })[0];
    chk('mirrorProf[' + stk + ']: \u677f\u817f\u5b58\u5728', !!leg);
    if (!leg) return;
    var f = G.flatten(leg.outer, 0.05);
    /* \u5750\u9762\u5e95\u9762\u5728 y=435(=H-t), 435..450 \u662f\u69ab\u5934\u533a\u3002
     * y \u5728 (380, 434.9) \u8fd9\u4e00\u5e26\u5e94\u8be5\u5168\u662f\u5b9e\u6599 \u2014\u2014 \u8f6e\u5ed3\u4e0d\u5f97\u6709\u9876\u70b9\u843d\u5728\u8fd9\u91cc\u3002
     * \u65e7\u7248 fillet \u4f1a\u51f9\u5230 414.73, round \u4f1a\u51f9\u5230 430.81\u3002 */
    var dip = f.filter(function (q) { return q.y > 380 && q.y < 434.9; });
    chk('mirrorProf[' + stk + ']: \u953c\u50cf\u8fb9\u7684\u5f27\u4e0d\u5f80\u6599\u5185\u51f9',
      dip.length === 0,
      dip.length ? ('minY=' + G.round(Math.min.apply(null, dip.map(function (q) { return q.y; })), 2)) : 'ok');
    /* \u4e24\u7247\u677f\u817f\u5fc5\u987b\u5404\u62ff\u5230**\u4e24\u4e2a**\u69ab\u773c(\u5750\u9762\u7684\u4e24\u4e2a\u69ab\u5934) */
    chk('mirrorProf[' + stk + ']: \u677f\u817f\u69ab\u773c\u6570\u4e0e finger \u4e00\u81f4', (leg.holes || []).length === 2,
      (leg.holes || []).length);
    chk('mirrorProf[' + stk + ']: \u65e0\u786c\u9519', u.warnings.filter(function (m) {
      return m.level === 'error';
    }).length === 0, u.warnings.filter(function (m) { return m.level === 'error'; })
      .map(function (m) { return m.text; }).slice(0, 1).join(''));
  });
})();

} catch (e) { L.push('FAIL exception ' + e.message + '\n' + (e.stack || '')); }
var fails = L.filter(function (s) { return s.indexOf('FAIL') === 0; }).length;
document.getElementById('out').textContent = L.join('\n') + '\n---\nTOTAL ' + L.length + '  FAILS ' + fails;
</script>
