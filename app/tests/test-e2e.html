<!doctype html><meta charset="utf-8"><title>e2e</title>
<body style="margin:0">
<iframe id="fr" src="../index.html" style="width:1500px;height:950px;border:0"></iframe>
<pre id="out">running</pre>
<script>
var L = [];
function chk(n, c, e) { L.push((c ? 'PASS ' : 'FAIL ') + n + (e !== undefined ? '  [' + e + ']' : '')); }
function done() {
  var fails = L.filter(function (s) { return s.indexOf('FAIL') === 0; }).length;
  document.getElementById('out').textContent = L.join('\n') + '\n---\nTOTAL ' + L.length + '  FAILS ' + fails;
  document.title = 'DONE fails=' + fails;
}
window.onload = function () {
  setTimeout(function () {
    var w = document.getElementById('fr').contentWindow;
    var d = w.document;
    /* 导出一节必须异步(File System Access API 全是 Promise),
     * 所以把尾巴挂在 tail 上, 等它 settle 完再 done()。
     * 否则 done() 会在导出断言还没跑完时就把总数写出去。 */
    var tail = Promise.resolve();
    try {
      // 库都加载
      chk('G loaded', !!w.G);
      chk('J loaded', !!w.J);
      chk('Models loaded', !!w.Models);
      chk('CAD loaded', !!w.CAD);
      chk('Nest loaded', !!w.Nest);
      chk('Render loaded', !!w.Render);
      chk('app booted', !!w.__app);
      // 启动自检
      chk('built-in selfTest no fail', w.__selfTest && w.__selfTest.fail === 0, JSON.stringify(w.__selfTest));
      chk('selfTest badge', /自检 \d+\/\d+/.test(d.getElementById('selfTest').textContent), d.getElementById('selfTest').textContent);
      // 默认生成
      var st = w.__app.state;
      /* 【第 9 轮改架】家具类型已并入结构配方, 顶部只剩两个真模式:
       * custom(结构配方/板位表/零件清单) 与 image(图片生成)。
       * 默认落在 custom + 配方 box, 效果等价于旧版的"默认箱体柜"。 */
      chk('default model custom', st.model === 'custom', st.model);
      chk('default recipe box', st.recipe === 'box', st.recipe);
      chk('default cmode recipe', st.cmode === 'recipe', st.cmode);
      chk('result parts > 0', st.result && st.result.parts.length > 0, st.result ? st.result.parts.length : 0);
      chk('nest done', !!st.nest && st.nest.sheets.length >= 1, st.nest ? st.nest.sheets.length : 0);
      // 无 error 级提示
      var errs = d.querySelectorAll('#msgs .msg.error');
      chk('no error messages', errs.length === 0, Array.prototype.map.call(errs, function (e) { return e.textContent; }).join(' | '));
      // 统计栏
      chk('stat filled', d.getElementById('stat').textContent.indexOf('零件') >= 0, d.getElementById('stat').textContent.slice(0, 90));
      /* 排样质量的三个新指标必须上屏: 紧凑度 / 最大剩料 / 获胜策略 */
      var statTxt = d.getElementById('stat').textContent;
      chk('stat 显示紧凑度', /紧凑度\s*[\d.]+%/.test(statTxt), statTxt.slice(0, 200));
      chk('stat 显示最大剩料', /最大剩料\s*[\d.]+×[\d.]+mm/.test(statTxt), statTxt.slice(0, 200));
      chk('stat 显示获胜策略与比选数', /策略\s*\S+（比选 \d+ 方案）/.test(statTxt), statTxt.slice(0, 260));
      chk('排样统计带策略名', !!st.nest.stats.strategy && w.Nest.strategies().indexOf(st.nest.stats.strategy) >= 0, st.nest.stats.strategy);
      chk('默认跑满 25 个方案', st.nest.stats.strategiesTried === 25, st.nest.stats.strategiesTried);
      chk('紧凑度 >= 利用率', st.nest.stats.packDensity >= st.nest.stats.utilization - 1e-9,
        st.nest.stats.packDensity + ' / ' + st.nest.stats.utilization);
      /* 统计条是 flex-wrap 的: 条目一多就换行变高, 会把下方画布往下推。
       * 这里盯住“统计条不得涨到把主视图挤没”, 否则以后再加指标时
       * 会静静地把三视图/排样图压成一条缝。 */
      var statH = d.getElementById('stat').getBoundingClientRect().height;
      chk('统计条高度不失控(<=两行)', statH <= 76, statH);
      // 料单表
      chk('list rows', d.querySelectorAll('#listPane tbody tr').length === st.result.parts.length, d.querySelectorAll('#listPane tbody tr').length);
      // canvas 真的画了东西
      function painted(id) {
        var cv = d.getElementById(id);
        if (!cv || !cv.width) return -1;
        var g = cv.getContext('2d');
        var px = g.getImageData(0, 0, cv.width, cv.height).data;
        var n = 0;
        for (var i = 3; i < px.length; i += 4 * 37) if (px[i] > 0) n++;
        return n;
      }
      chk('nest canvas painted', painted('cvNest') > 50, painted('cvNest'));
      /* 排样策略下拉真的接入了 sheetOpts + 改完会重算 */
      (function () {
        var selEl = d.getElementById('nestStrategy');
        chk('排样策略下拉存在', !!selEl && selEl.options.length >= 5, selEl ? selEl.options.length : 'none');
        chk('默认为自动比选', selEl.value === 'auto', selEl.value);
        chk('sheetOpts 带上了 strategy', w.__app.sheetOpts().strategy === 'auto', w.__app.sheetOpts().strategy);
        var before = w.__app.state.nest.stats.strategy;
        selEl.value = 'maxside/shelf';
        selEl.dispatchEvent(new w.Event('change'));
        var after = w.__app.state.nest.stats;
        chk('指定货架式后只跑 1 个方案', after.strategiesTried === 1, after.strategiesTried);
        chk('指定策略后报告的就是它', after.strategy === 'maxside/shelf', after.strategy);
        chk('指定策略后排样仍合法', w.Nest.verify(w.__app.state.nest, w.__app.sheetOpts()).length === 0);
        /* 比选不得差于单一策略 —— 这是“最大利用率”在 UI 层的兑现 */
        selEl.value = 'auto';
        selEl.dispatchEvent(new w.Event('change'));
        var auto = w.__app.state.nest.stats;
        chk('自动比选板数 <= 货架式板数', auto.sheetCount <= after.sheetCount, auto.sheetCount + ' vs ' + after.sheetCount);
        chk('自动比选紧凑度 >= 货架式', auto.packDensity >= after.packDensity - 1e-9,
          auto.packDensity.toFixed(4) + ' vs ' + after.packDensity.toFixed(4));
        chk('回到自动后又跑满 25 方案', auto.strategiesTried === 25, auto.strategiesTried);
      })();
      // 切到零件页/3D 页
      d.querySelector('.tab[data-pane="parts"]').click();
      chk('parts canvas painted', painted('cvParts') > 50, painted('cvParts'));
      d.querySelector('.tab[data-pane="asm"]').click();
      chk('asm canvas painted', painted('cvAsm') > 50, painted('cvAsm'));
      d.querySelector('.tab[data-pane="nest"]').click();

      // 遍历所有模型: 不得报错, 零件必须合法
      /* 旧的五个家具类型名现在是配方 key。selectModel 保留了向后兼容:
       * 传这些名字进去 = 切到配方模式 + 选中该配方 + 套用推荐尺寸。
       * 这条路径必须保住: 导入旧参数 JSON 也走它。 */
      var models = ['box', 'bookshelf', 'drawer', 'lattice', 'table'];
      models.forEach(function (m) {
        w.__app.selectModel(m);
        chk('model ' + m + ' -> recipe 模式', w.__app.state.model === 'custom' &&
          w.__app.state.cmode === 'recipe' && w.__app.state.recipe === m,
          w.__app.state.model + '/' + w.__app.state.cmode + '/' + w.__app.state.recipe);
        var s = w.__app.state;
        var bad = [];
        s.result.parts.forEach(function (p) {
          p.validate().forEach(function (x) { if (x.level === 'error') bad.push(p.name + ':' + x.text); });
        });
        chk('model ' + m + ' parts valid', bad.length === 0 && s.result.parts.length > 0,
          bad.length ? bad.slice(0, 2).join('|') : ('n=' + s.result.parts.length));
        var ne = w.Nest.verify(s.nest, w.__app.sheetOpts());
        chk('model ' + m + ' nest clean', ne.length === 0 && s.nest.oversize.length === 0,
          ne.slice(0, 2).join('|') + ' oversize=' + s.nest.oversize.length);
        var msgErr = d.querySelectorAll('#msgs .msg.error');
        chk('model ' + m + ' no UI error', msgErr.length === 0,
          Array.prototype.map.call(msgErr, function (e) { return e.textContent; }).slice(0, 2).join('|'));
        // 导出必须可用
        var dxf = w.CAD.toDXF(w.__app.nestItems(), { kerf: 0 });
        chk('model ' + m + ' dxf ok', dxf.indexOf('EOF') > 0 && dxf.length > 2000, dxf.length);
        var svg = w.CAD.toSVG(w.__app.partItems(), {});
        chk('model ' + m + ' svg ok', svg.indexOf('</svg>') > 0 && /NaN|undefined/.test(svg) === false, svg.length + (/NaN/.test(svg) ? ' HAS-NaN' : ''));
        var csv = w.CAD.toCSV(s.result.parts);
        chk('model ' + m + ' csv ok', csv.split('\r\n').length >= s.result.parts.length + 1);
      });

      // 燕尾 + CNC 让位组合
      w.__app.selectModel('drawer');
      d.getElementById('jointStyle').value = 'dovetail';
      d.getElementById('jointStyle').dispatchEvent(new w.Event('change'));
      d.getElementById('machine').value = 'cnc';
      d.getElementById('machine').dispatchEvent(new w.Event('change'));
      var s2 = w.__app.state;
      var bad2 = [];
      s2.result.parts.forEach(function (p) { p.validate().forEach(function (x) { if (x.level === 'error') bad2.push(p.name + ':' + x.text); }); });
      chk('dovetail+cnc valid', bad2.length === 0, bad2.slice(0, 3).join('|'));
      chk('dovetail+cnc dxf', w.CAD.toDXF(w.__app.nestItems(), { kerf: 0.15 }).indexOf('EOF') > 0);
      chk('cnc shows tool row', d.getElementById('toolRow').style.display !== 'none');
      chk('dovetail shows angle row', d.getElementById('dtRow').style.display !== 'none');

      /* ---- 自定义 CNC 刀具直径（第 8 轮）---- */
      chk('cnc shows tool chips + hint',
        d.getElementById('toolChipRow').style.display !== 'none' &&
        d.getElementById('toolHint').style.display !== 'none');
      /* dogbone 是圆, 没有"耳长"这回事 -> 该行必须藏起来 */
      chk('dogbone hides ear-length row', d.getElementById('earRow').style.display === 'none');
      d.getElementById('reliefType').value = 'tbone';
      d.getElementById('reliefType').dispatchEvent(new w.Event('change'));
      chk('tbone shows ear-length row',
        d.getElementById('earRow').style.display !== 'none' &&
        d.getElementById('earHint').style.display !== 'none');
      // chip 点一下就要填进输入框, 并且高亮跟上
      var tc = Array.prototype.filter.call(d.querySelectorAll('#toolChips .chip'), function (x) { return x.dataset.d === '6.35'; })[0];
      chk('tool chips present (6.35 = 1/4 inch)', !!tc);
      tc.click();
      chk('tool chip fills input', +d.getElementById('toolDia').value === 6.35, d.getElementById('toolDia').value);
      chk('tool chip highlights', tc.classList.contains('on'));
      chk('tool hint states relief radius', /让位半径 = 3\.175/.test(d.getElementById('toolHint').textContent),
        d.getElementById('toolHint').textContent.slice(0, 60));
      // 刀径必须真的改变几何: 6.35 的让位量应显著大于 3.175
      function reliefArea() {
        return w.__app.state.result.parts.reduce(function (a, p) { return a + Math.abs(p.area()); }, 0);
      }
      var aBig = reliefArea();
      d.getElementById('toolDia').value = 3.175;
      d.getElementById('toolDia').dispatchEvent(new w.Event('change'));
      var aSmall = reliefArea();
      chk('bigger tool removes more material (让位真的生效)', aBig < aSmall - 1,
        '6.35mm -> ' + Math.round(aBig) + 'mm² vs 3.175mm -> ' + Math.round(aSmall) + 'mm²');
      // 耳长也必须真的生效(2r -> 3r 会多牺牲料)
      d.getElementById('earLen').value = 3;
      d.getElementById('earLen').dispatchEvent(new w.Event('change'));
      var aEar3 = reliefArea();
      d.getElementById('earLen').value = 2;
      d.getElementById('earLen').dispatchEvent(new w.Event('change'));
      var aEar2 = reliefArea();
      chk('longer ear removes more material (耳长参数真的生效)', aEar3 < aEar2 - 0.5,
        '3r -> ' + Math.round(aEar3) + ' vs 2r -> ' + Math.round(aEar2));
      // 荒谬刀径要夹住并明说, 而不是切出废图
      d.getElementById('toolDia').value = 999;
      d.getElementById('toolDia').dispatchEvent(new w.Event('change'));
      chk('absurd tool dia clamped with warning',
        /已按 25mm 计算/.test(d.getElementById('toolHint').textContent) &&
        d.getElementById('toolHint').className.indexOf('warnHint') >= 0,
        d.getElementById('toolHint').textContent.slice(0, 50));
      var badTool = [];
      w.__app.state.result.parts.forEach(function (p) {
        p.validate().forEach(function (x) { if (x.level === 'error') badTool.push(p.name + ':' + x.text); });
      });
      chk('absurd tool dia still yields valid parts', badTool.length === 0, badTool.slice(0, 2).join('|'));
      d.getElementById('toolDia').value = 3.175;
      d.getElementById('toolDia').dispatchEvent(new w.Event('change'));
      d.getElementById('reliefType').value = 'dogbone';
      d.getElementById('reliefType').dispatchEvent(new w.Event('change'));

      // kerf 补偿真的改变了几何
      var noK = w.CAD.toSVG(w.__app.partItems(), { kerf: 0 });
      var wiK = w.CAD.toSVG(w.__app.partItems(), { kerf: 0.4 });
      chk('kerf changes geometry', noK !== wiK && wiK.indexOf('NaN') < 0);

      // 极端参数不崩
      w.__app.selectModel('box');
      [[150, 100, 150, 9], [3000, 800, 2400, 25], [200, 200, 200, 21]].forEach(function (v) {
        d.getElementById('width').value = v[0];
        d.getElementById('depth').value = v[1];
        d.getElementById('height').value = v[2];
        d.getElementById('thickness').value = v[3];
        var ok = true, why = '';
        try {
          d.getElementById('width').dispatchEvent(new w.Event('change'));
        } catch (e) { ok = false; why = e.message; }
        chk('extreme ' + v.join('/') + ' no crash', ok && !!w.__app.state.result, why);
      });

      /* ================= 自定义结构 UI 端到端（重构版）================= */
      /* 前面的用例把 machine 改成 cnc、jointStyle 改成 dovetail 了。
       * 不复位的话 dogbone 让位会削掉内凹角的料, 精确面积断言必然失败
       * —— 这是测试自身的状态泄漏, 必须显式清干净。 */
      d.getElementById('machine').value = 'laser';
      d.getElementById('machine').dispatchEvent(new w.Event('change'));
      d.getElementById('jointStyle').value = 'finger';
      d.getElementById('jointStyle').dispatchEvent(new w.Event('change'));
      d.getElementById('kerf').value = 0;
      d.getElementById('kerf').dispatchEvent(new w.Event('change'));
      d.getElementById('realThickness').value = 0;
      d.getElementById('realThickness').dispatchEvent(new w.Event('change'));
      d.getElementById('thickness').value = 15;
      d.getElementById('thickness').dispatchEvent(new w.Event('change'));
      d.getElementById('fit').value = 0.2;
      d.getElementById('fit').dispatchEvent(new w.Event('change'));
      w.__app.selectModel('custom');
      var sc = w.__app.state;
      chk('custom chip active', d.querySelector('.chip[data-model="custom"]').classList.contains('on'));
      chk('custom panel shown', d.getElementById('cusSec').style.display !== 'none');
      chk('custom shows edit tab', d.getElementById('tabEdit').style.display !== 'none');
      chk('custom auto opens editor', sc.pane === 'edit', sc.pane);
      /* 【第 9 轮改架】自定义的默认子模式从"零件清单"改成"结构配方"。
       * 理由: 家具类型 chip 没了之后, 配方就是唯一的"一键出成品"入口,
       * 默认落在清单上会让新用户看到一堆无接合的散板。 */
      chk('custom default cmode=recipe', sc.cmode === 'recipe', sc.cmode);
      chk('配方模式露接合方式', d.getElementById('jsRow').style.display !== 'none');
      chk('配方模式有接合', (sc.result.info.tenonJoints || 0) + (sc.result.info.lapJoints || 0) > 0,
        JSON.stringify(sc.result.info).slice(0, 120));
      /* 切到清单模式继续测清单那一整套。
       * 接合方式在清单模式下必须隐 —— Cutlist.build 逐行独立下料,
       * 行与行之间根本没有接合, 露出来就是骗人。 */
      w.__app.setCmode('list');
      chk('custom list mode hides joint style', d.getElementById('jsRow').style.display === 'none');
      chk('custom cmode=list', sc.cmode === 'list', sc.cmode);
      chk('custom default rows non-empty', sc.rows.length > 0, sc.rows.length);
      chk('custom default parts', sc.result.parts.length === sc.rows.length, sc.result.parts.length + '/' + sc.rows.length);
      chk('list mode hides overall dims', d.getElementById('dimSec').style.display === 'none');
      function badOf(parts) {
        var b = [];
        parts.forEach(function (p) { p.validate().forEach(function (x) { if (x.level === 'error') b.push(p.name + ':' + x.text); }); });
        return b;
      }
      chk('custom default valid', badOf(sc.result.parts).length === 0, badOf(sc.result.parts).slice(0, 3).join('|'));
      chk('editor grid rendered', d.querySelectorAll('#editGrid tbody tr').length >= sc.rows.length,
        d.querySelectorAll('#editGrid tbody tr').length);
      chk('editor bar rendered', d.getElementById('editBar').textContent.indexOf('零件清单') >= 0,
        d.getElementById('editBar').textContent.slice(0, 40));

      /* ---- 清单: 加一行 / 改数字 / 数量 ---- */
      var n0 = w.__app.state.rows.length;
      d.getElementById('btnAddRow').click();
      chk('add row', w.__app.state.rows.length === n0 + 1, w.__app.state.rows.length);
      chk('add row -> new part', w.__app.state.result.parts.length === n0 + 1, w.__app.state.result.parts.length);
      // 直接改活数据 + 触发重算(等价于在表格里输入)
      var st2 = w.__app.state;
      st2.rows[st2.rows.length - 1] = { name: '测试板', len: 800, wid: 400, qty: 3, grain: 'long' };
      d.getElementById('respectGrain').checked = true;
      d.getElementById('respectGrain').dispatchEvent(new w.Event('change'));
      w.__app.generate();
      var tp = w.__app.state.result.parts.filter(function (p) { return p.name === '测试板'; })[0];
      chk('row edit applied', !!tp && Math.abs(tp.bbox().w - 800) < 1e-6 && Math.abs(tp.bbox().h - 400) < 1e-6,
        tp ? w.G.round(tp.bbox().w, 1) + 'x' + w.G.round(tp.bbox().h, 1) : 'missing');
      chk('row qty applied', tp && tp.qty === 3, tp && tp.qty);
      chk('row grain applied', tp && tp.meta.grain === 'long', tp && tp.meta.grain);
      // 纹理锁定 -> 排样必须不转 90
      var placed = [];
      w.__app.state.nest.sheets.forEach(function (sh) {
        sh.placements.forEach(function (pl) { if (pl.part.name === '测试板') placed.push(pl.rot); });
      });
      chk('grain locks rotation', placed.length === 3 && placed.every(function (r) { return r === 0; }), placed.join(','));
      chk('grain reported', w.__app.state.nest.grainForced.indexOf('测试板') >= 0,
        (w.__app.state.nest.grainForced || []).join(','));
      // 关掉纹理约束 -> 允许旋转(至少不再被 verify 拦)
      d.getElementById('respectGrain').checked = false;
      d.getElementById('respectGrain').dispatchEvent(new w.Event('change'));
      chk('grain off no verify err', w.Nest.verify(w.__app.state.nest, w.__app.sheetOpts()).length === 0);
      d.getElementById('respectGrain').checked = true;
      d.getElementById('respectGrain').dispatchEvent(new w.Event('change'));

      /* ---- 清单: 停用行 / 非法尺寸 ---- */
      var nBefore = w.__app.state.result.parts.length;
      st2.rows[st2.rows.length - 1].off = true;
      w.__app.generate();
      chk('row off excluded', w.__app.state.result.parts.length === nBefore - 1, w.__app.state.result.parts.length);
      st2.rows[st2.rows.length - 1] = { name: '坏板', len: 0, wid: 200 };
      w.__app.generate();
      chk('bad size -> error msg', d.querySelectorAll('#msgs .msg.error').length > 0 &&
        /长\/宽/.test(d.getElementById('msgs').textContent), d.getElementById('msgs').textContent.slice(0, 70));
      chk('bad size no crash', !!w.__app.state.result);
      st2.rows.pop();
      w.__app.generate();

      /* ---- 清单模板: 每个都要能出合法零件 ---- */
      var tk = d.getElementById('tplKey');
      chk('templates listed', tk.options.length >= 5, tk.options.length);
      for (var ti2 = 0; ti2 < tk.options.length; ti2++) {
        tk.value = tk.options[ti2].value;
        d.getElementById('btnTpl').click();
        var stT = w.__app.state;
        var bt = badOf(stT.result.parts);
        chk('template ' + tk.value + ' valid', stT.result.parts.length > 0 && bt.length === 0,
          stT.result.parts.length + ' | ' + bt.slice(0, 2).join('|'));
        chk('template ' + tk.value + ' nest ok',
          w.Nest.verify(stT.nest, w.__app.sheetOpts()).length === 0 && stT.nest.oversize.length === 0,
          'oversize=' + stT.nest.oversize.length);
        chk('template ' + tk.value + ' dxf ok', w.CAD.toDXF(w.__app.nestItems()).indexOf('EOF') > 0);
      }

      /* ---- 洞洞板: 阵列孔真的生成了 ---- */
      tk.value = 'pegboard';
      d.getElementById('btnTpl').click();
      var pegP = w.__app.state.result.parts[0];
      chk('pegboard many holes', pegP.holes.length > 20, pegP.holes.length);
      chk('pegboard holes valid', badOf([pegP]).length === 0, badOf([pegP]).slice(0, 2).join('|'));
      chk('pegboard meta', pegP.meta.pegboard && pegP.meta.pegboard.count === pegP.holes.length,
        JSON.stringify(pegP.meta.pegboard));
      chk('pegboard note', /洞洞板/.test(pegP.meta.note), pegP.meta.note);
      // 改孔距 -> 孔数变化
      w.__app.state.rows[0].pegboard.pitch = 80;
      w.__app.generate();
      chk('pitch changes hole count', w.__app.state.result.parts[0].holes.length < pegP.holes.length,
        w.__app.state.result.parts[0].holes.length + ' vs ' + pegP.holes.length);

          });
        }).then(function () {
          // 环境复原, 免得污染后续(尽管这是最后一节)
          if (realSave) w.showSaveFilePicker = realSave;
          if (realDir) w.showDirectoryPicker = realDir;
          A.EXP.dir = null; A.EXP.dirName = '';
          A.syncExpPath();
        });
      })();
    } catch (e) {
      chk('exception', false, e.message + ' @ ' + (e.stack || '').split('\n')[1]);
    }
    tail.then(done, function (e) {
      chk('导出异步异常', false, e && (e.message + ' @ ' + (e.stack || '').split('\n')[1]));
      done();
    });
  }, 1200);
};
</script>
