<!doctype html><meta charset="utf-8"><body><pre id="out">running</pre>
<script src="../js/geom.js"></script><script src="../js/joints.js"></script>
<script src="../js/part.js"></script><script src="../js/models.js"></script>
<script src="../js/imagetrace.js"></script><script src="../js/imagemodel.js"></script>
<script src="../js/features.js"></script><script src="../js/custom.js"></script>
<script src="../js/cutlist.js"></script><script src="../js/nest.js"></script>
<script>
var L = [];
function chk(n, c, e) { L.push((c ? 'PASS ' : 'FAIL ') + n + (e !== undefined ? '  [' + e + ']' : '')); }
function near(a, b, t) { return Math.abs(a - b) < (t || 1e-6); }
function mkp(name, w, h, grain, t) {
  var p = new Part(name, t || 15);
  p.setOuter(G.rect(0, 0, w, h));
  if (grain) p.meta.grain = grain;
  return p;
}
function items(list) {   // [[name,w,h,qty,grain]...]
  return list.map(function (d) { return { part: mkp(d[0], d[1], d[2], d[4]), qty: d[3] || 1 }; });
}
var SO = { w: 2440, h: 1220, margin: 10, gap: 6 };
function so(extra) { return Object.assign({}, SO, extra || {}); }

try {
/* ============================================================
 * 1. 策略表与比选机制
 * ============================================================ */
var strat = Nest.strategies();
chk('策略表 5 排序 × 5 放置 = 25', strat.length === 25, strat.length);
chk('策略名唯一', new Set(strat).size === 25);
chk('保留货架式作为保底', strat.filter(function (s) { return /\/shelf$/.test(s); }).length === 5);

/* ============================================================
 * 2. 核心承诺: 比选结果不得差于任何单一策略
 *    这是"最大利用率"的真正判据 —— 冠军必须是全场最优。
 * ============================================================ */
var mix = items([['大长条', 1200, 400], ['方1', 300, 300], ['方2', 300, 300], ['方3', 300, 300],
  ['长条2', 1100, 260], ['高瘦1', 180, 900], ['高瘦2', 180, 900],
  ['中1', 700, 180], ['中2', 700, 180], ['大方', 420, 420],
  ['小1', 90, 90], ['小2', 90, 90], ['小3', 90, 90], ['小4', 90, 90]]);
var auto = Nest.nest(mix, so());
var worstSheets = 0, anyBetter = null;
strat.forEach(function (s) {
  var r = Nest.nest(mix, so({ strategy: s }));
  if (r.stats.sheetCount > worstSheets) worstSheets = r.stats.sheetCount;
  // 冠军不能被任何单策略在(张数, span)上严格击败
  var beats = r.stats.sheetCount < auto.stats.sheetCount ||
    (r.stats.sheetCount === auto.stats.sheetCount && r.stats.spanArea < auto.stats.spanArea - 1e-6);
  if (beats && !anyBetter) anyBetter = s + ' sheets=' + r.stats.sheetCount + ' span=' + Math.round(r.stats.spanArea);
});
chk('比选冠军不被任何单策略击败', !anyBetter, anyBetter || (auto.stats.strategy + ' span=' + Math.round(auto.stats.spanArea)));
chk('比选确实跑满 25 个方案', auto.stats.strategiesTried === 25, auto.stats.strategiesTried);
chk('报告了获胜策略名', strat.indexOf(auto.stats.strategy) >= 0, auto.stats.strategy);

/* 相对旧货架算法的实际增益（回归护栏: 一旦有人改坏比选就会掉下来） */
var shelfOnly = Nest.nest(mix, so({ strategy: 'maxside/shelf' }));
chk('混合尺寸: 紧凑度显著优于货架式',
  auto.stats.packDensity > shelfOnly.stats.packDensity + 0.1,
  auto.stats.packDensity.toFixed(4) + ' vs ' + shelfOnly.stats.packDensity.toFixed(4));

/* 桌子: 旧算法要 2 张板, 新算法 1 张 —— 直接省一张 2440×1220 */
var tbl = Models.table({ thickness: 18, width: 1200, depth: 600, height: 740 });
var tblItems = tbl.parts.map(function (p) { return { part: p, qty: p.qty || 1 }; });
var tblAuto = Nest.nest(tblItems, so());
var tblShelf = Nest.nest(tblItems, so({ strategy: 'maxside/shelf' }));
chk('桌/凳: 比选只用 1 张板(货架式要 2 张)',
  tblAuto.stats.sheetCount === 1 && tblShelf.stats.sheetCount === 2,
  tblAuto.stats.sheetCount + ' vs ' + tblShelf.stats.sheetCount);
/* 格架: 货架式紧凑度 0.49, 比选 0.84 */
var lat = Models.lattice({ thickness: 12, width: 600, depth: 300, height: 400, cols: 3, rows: 2 });
var latItems = lat.parts.map(function (p) { return { part: p, qty: p.qty || 1 }; });
var latAuto = Nest.nest(latItems, so()), latShelf = Nest.nest(latItems, so({ strategy: 'maxside/shelf' }));
chk('格架/酒格: 紧凑度大幅提升',
  latAuto.stats.packDensity > latShelf.stats.packDensity + 0.25,
  latAuto.stats.packDensity.toFixed(4) + ' vs ' + latShelf.stats.packDensity.toFixed(4));

/* ============================================================
 * 3. 硬约束: 不重叠 / 不越界 / 间距达标
 *    这些是"能不能真的切"的底线, 任何策略都不许破。
 * ============================================================ */
var scenarios = [
  ['混合', mix, so()],
  ['家具箱体', Models.box({ thickness: 15, width: 600, depth: 320, height: 720, fit: 0.2, shelves: 2 }).parts.map(function (p) { return { part: p, qty: p.qty || 1 }; }), so()],
  ['书架', Models.bookshelf({ thickness: 18, width: 800, depth: 280, height: 1800, shelves: 4 }).parts.map(function (p) { return { part: p, qty: p.qty || 1 }; }), so()],
  ['桌凳', tblItems, so()],
  ['大间距', mix, so({ gap: 30 })],
  ['零间距', mix, so({ gap: 0 })],
  ['大留白', mix, so({ margin: 60 })],
  ['零留白', mix, so({ margin: 0 })],
  ['小幅面', items([['a', 260, 180], ['b', 260, 180], ['c', 200, 150, 3], ['d', 90, 90, 6]]), { w: 600, h: 400, margin: 10, gap: 6 }],
  ['竖幅面', mix, { w: 1220, h: 2440, margin: 10, gap: 6 }]
];
var allClean = true, dirty = '';
scenarios.forEach(function (sc) {
  strat.forEach(function (st) {
    var cfg = Object.assign({}, sc[2], { strategy: st });
    var r = Nest.nest(sc[1], cfg);
    var errs = Nest.verify(r, cfg);
    if (errs.length) { allClean = false; if (!dirty) dirty = sc[0] + ' ' + st + ': ' + errs[0]; }
  });
});
chk('10 场景 × 25 策略 全部无重叠/越界/间距不足', allClean, dirty);

/* verify 的间距判据必须真的会报警。
 * 变异时不能只改 x: 排样器可能把两件竖着堆(同 x 不同 y),
 * 那时改 x 反而把 y 方向的间距留着 -> 并不违规, 断言会假红。
 * 正确做法: 把第二件搬到第一件正上方、且 x 完全对齐,
 * 于是 x 方向重叠(dx<0)、y 方向只隔 2mm < gap 6mm。 */
var vTest = Nest.nest(items([['x', 400, 300, 2]]), so());
var vErr0 = Nest.verify(vTest, so());
chk('正常排样 verify 干净', vErr0.length === 0, vErr0.join('|'));
if (vTest.sheets[0].placements.length >= 2) {
  var pa = vTest.sheets[0].placements[0], pb = vTest.sheets[0].placements[1];
  var saveX = pb.x, saveY = pb.y;
  pb.x = pa.x; pb.y = pa.y + pa.h + 2;
  var vErr1 = Nest.verify(vTest, so());
  chk('间距不足能被 verify 抓到(变异测试)', vErr1.length > 0 && /间距不足/.test(vErr1.join('')), vErr1.join('|'));
  /* 再验一次重叠: 直接叠在一起必须报“重叠” */
  pb.x = pa.x; pb.y = pa.y;
  chk('完全重叠能被 verify 抓到', /重叠/.test(Nest.verify(vTest, so()).join('')));
  pb.x = saveX; pb.y = saveY;
  chk('恢复后 verify 又干净', Nest.verify(vTest, so()).length === 0);
}
/* gap 未传时不做间距判定(保持旧行为, 老测试不受影响) */
var vNoGap = Nest.nest(items([['y', 400, 300, 2]]), so());
vNoGap.sheets[0].placements[1].x = vNoGap.sheets[0].placements[0].x + vNoGap.sheets[0].placements[0].w + 1;
chk('verify 不传 gap 时只查重叠', Nest.verify(vNoGap, { margin: 10 }).length === 0);

/* ============================================================
 * 4. 间距语义: 实体之间恰好留出 gap, 且末列的 gap 不占板面
 * ============================================================ */
/* 可用区 2420 宽。4 件宽 600.5, 3 条 6mm 间距 => 2402+18 = 2420 刚好。
 * 若把末列 gap 也算进可用区(旧货架式做法), 需要 2426 > 2420 就会翻到第二张板。 */
var edge = items([['贴边1', 600.5, 1200], ['贴边2', 600.5, 1200], ['贴边3', 600.5, 1200], ['贴边4', 600.5, 1200]]);
var eR = Nest.nest(edge, so());
chk('末列 gap 不占板面: 4 件贴边仍是 1 张板', eR.stats.sheetCount === 1, eR.stats.sheetCount);
chk('贴边排样无越界/间距不足', Nest.verify(eR, so()).length === 0);
var exs = eR.sheets[0].placements.map(function (p) { return p.x; }).sort(function (a, b) { return a - b; });
chk('贴边件最右侧正好抵到可用区边界',
  near(exs[3] + 600.5, SO.w - SO.margin, 1e-6), exs.map(function (v) { return G.round(v, 2); }).join(','));
var gapsSeen = [];
for (var gi = 1; gi < 4; gi++) gapsSeen.push(G.round(exs[gi] - (exs[gi - 1] + 600.5), 4));
chk('相邻件间距恰为 gap', gapsSeen.every(function (v) { return near(v, 6, 1e-6); }), gapsSeen.join(','));

/* gap 变大, 排样必须跟着变松(而不是无视 gap) */
var g0 = Nest.nest(items([['p', 500, 400, 6]]), so({ gap: 0 }));
var g40 = Nest.nest(items([['p', 500, 400, 6]]), so({ gap: 40 }));
chk('gap=0 时紧凑度 >= gap=40', g0.stats.packDensity >= g40.stats.packDensity - 1e-9,
  g0.stats.packDensity.toFixed(4) + ' vs ' + g40.stats.packDensity.toFixed(4));
chk('gap=40 仍满足自身间距约束', Nest.verify(g40, so({ gap: 40 })).length === 0);

/* ============================================================
 * 5. 变换正确性: xf 必须让包围盒左下角精确落在 (x,y), 且不镜像
 * ============================================================ */
var xfOK = true, xfWhy = '';
[auto, tblAuto, latAuto, eR, g40].forEach(function (r) {
  r.sheets.forEach(function (s) {
    s.placements.forEach(function (pl) {
      var q = pl.part.transformed(pl.xf), b = q.bbox();
      if (!near(b.x0, pl.x, 1e-6) || !near(b.y0, pl.y, 1e-6)) {
        xfOK = false; xfWhy = pl.name + ' bb=' + G.round(b.x0, 3) + ',' + G.round(b.y0, 3) + ' want ' + G.round(pl.x, 3) + ',' + G.round(pl.y, 3);
      }
      if (!near(b.w, pl.w, 1e-6) || !near(b.h, pl.h, 1e-6)) { xfOK = false; xfWhy = pl.name + ' size drift'; }
      if (G.loopArea(q.outer) <= 0) { xfOK = false; xfWhy = pl.name + ' 绕向被翻转'; }
    });
  });
});
chk('placement 变换精确且未镜像', xfOK, xfWhy);
/* 旋转 90° 的件: w/h 必须是交换后的值 */
var rotSeen = false, rotOK = true;
[auto, latAuto].forEach(function (r) {
  r.sheets.forEach(function (s) {
    s.placements.forEach(function (pl) {
      if (pl.rot !== 90) return;
      rotSeen = true;
      var bb = pl.part.bbox();
      if (!near(pl.w, bb.h, 1e-6) || !near(pl.h, bb.w, 1e-6)) rotOK = false;
    });
  });
});
chk('存在 90° 旋转件且长宽已交换', rotSeen && rotOK, rotSeen ? rotOK : 'none rotated');

/* ============================================================
 * 6. 全部零件都被排进去(不许悄悄丢件)
 * ============================================================ */
function totalQty(list) { return list.reduce(function (a, it) { return a + (it.qty || 1); }, 0); }
var lostAny = '';
scenarios.forEach(function (sc) {
  var r = Nest.nest(sc[1], sc[2]);
  var placed = 0;
  r.sheets.forEach(function (s) { placed += s.placements.length; });
  if (placed + r.oversize.length !== totalQty(sc[1])) {
    lostAny = sc[0] + ' placed=' + placed + '+over' + r.oversize.length + ' want ' + totalQty(sc[1]);
  }
});
chk('所有场景零件数守恒(排入 + 超幅面 = 总数)', !lostAny, lostAny);
/* 同一零件 qty>1 要按份编号, 便于师傅点数 */
var qn = Nest.nest(items([['层板', 560, 300, 4]]), so());
var names = [];
qn.sheets.forEach(function (s) { s.placements.forEach(function (p) { names.push(p.name); }); });
chk('qty>1 的零件带 #序号', names.sort().join(',') === '层板#1,层板#2,层板#3,层板#4', names.join(','));

/* ============================================================
 * 7. 纹理方向约束在新算法下依然成立
 * ============================================================ */
var grItems = items([['横纹件', 800, 300, 3, 'long'], ['竖纹件', 800, 300, 3, 'cross'], ['随意件', 400, 400, 2]]);
var grOK = true, grWhy = '';
strat.forEach(function (st) {
  var cfg = so({ respectGrain: true, strategy: st });
  var r = Nest.nest(grItems, cfg);
  var e = Nest.verify(r, cfg);
  if (e.length) { grOK = false; if (!grWhy) grWhy = st + ': ' + e[0]; }
  r.sheets.forEach(function (s) {
    s.placements.forEach(function (pl) {
      var g = pl.part.meta.grain;
      if (g === 'long' && pl.rot !== 0) { grOK = false; grWhy = st + ' long 被转了'; }
      if (g === 'cross' && pl.rot !== 90) { grOK = false; grWhy = st + ' cross 未转'; }
    });
  });
});
chk('25 策略全部遵守纹理方向', grOK, grWhy);
var grR = Nest.nest(grItems, so({ respectGrain: true }));
chk('报告纹理锁定种类数', grR.stats.grainLocked === 2, grR.stats.grainLocked);
/* 关掉纹理约束后自由度更高, 紧凑度不该变差 */
var grOff = Nest.nest(grItems, so({ respectGrain: false }));
chk('关掉纹理约束紧凑度不降', grOff.stats.packDensity >= grR.stats.packDensity - 1e-9,
  grOff.stats.packDensity.toFixed(4) + ' vs ' + grR.stats.packDensity.toFixed(4));
chk('关掉纹理约束后不再上报锁定', grOff.stats.grainLocked === 0, grOff.stats.grainLocked);
chk('未显式设置时默认允许 90° 旋转', Nest.nest(grItems, so()).stats.grainLocked === 0);
/* 竖幅面: 纹理的允许角度必须翻过来 */
var vGr = Nest.nest(items([['横纹件', 600, 300, 2, 'long']]), { w: 1220, h: 2440, margin: 10, gap: 6, respectGrain: true });
chk('竖幅面 long 件应转 90°', vGr.sheets[0].placements.every(function (p) { return p.rot === 90; }),
  vGr.sheets[0].placements.map(function (p) { return p.rot; }).join(','));
chk('竖幅面纹理 verify 干净', Nest.verify(vGr, { w: 1220, h: 2440, margin: 10, gap: 6, respectGrain: true }).length === 0);
/* allowRotate:false 时任何件都不许转 */
var noRot = Nest.nest(items([['随意', 400, 300, 5]]), so({ allowRotate: false }));
chk('allowRotate=false 全部 rot 0',
  noRot.sheets.every(function (s) { return s.placements.every(function (p) { return p.rot === 0; }); }));

/* ============================================================
 * 8. 超幅面识别 + 空输入
 * ============================================================ */
var ov = Nest.nest([{ part: mkp('超大板', 3000, 1500), qty: 1 }], so());
chk('超幅面被标记且不开板', ov.oversize.length === 1 && ov.sheets.length === 0, ov.oversize.length + '/' + ov.sheets.length);
/* 转 90° 后能放下的, 不该误判超幅面: 2400×1100 竖着放不下, 转了才行 */
var needRot = Nest.nest([{ part: mkp('细长', 1150, 2400), qty: 1 }], so());
chk('转 90° 才放得下的件不误判超幅面', needRot.oversize.length === 0 && needRot.sheets.length === 1,
  needRot.oversize.length + '/' + needRot.sheets.length);
chk('该件确实被转了 90°', needRot.sheets[0].placements[0].rot === 90);
/* 纹理锁死方向导致放不下 -> 必须报超幅面, 不能偷偷转 */
var lockOver = Nest.nest([{ part: mkp('锁死', 1150, 2400, 'long'), qty: 1 }], so({ respectGrain: true }));
chk('纹理锁死且放不下 -> 报超幅面', lockOver.oversize.length === 1, lockOver.oversize.length);
var empty = Nest.nest([], so());
chk('空输入不炸', empty.sheets.length === 0 && empty.stats.sheetCount === 0 && empty.stats.utilization === 0);
chk('空输入 offcut 为 null', empty.stats.offcut === null);

/* ============================================================
 * 9. 统计口径
 * ============================================================ */
var stR = Nest.nest(mix, so());
var netArea = 0;
mix.forEach(function (it) { netArea += Math.abs(it.part.area()) * (it.qty || 1); });
chk('partArea = 零件净面积之和', near(stR.stats.partArea, netArea, 1e-6),
  G.round(stR.stats.partArea, 2) + ' vs ' + G.round(netArea, 2));
chk('sheetArea = 张数 × 单张面积', near(stR.stats.sheetArea, stR.stats.sheetCount * 2440 * 1220, 1e-6));
chk('utilization = partArea / sheetArea', near(stR.stats.utilization, stR.stats.partArea / stR.stats.sheetArea, 1e-12));
chk('utilization 在 0..1', stR.stats.utilization > 0 && stR.stats.utilization < 1, stR.stats.utilization);
chk('packDensity 在 0..1', stR.stats.packDensity > 0 && stR.stats.packDensity <= 1 + 1e-9, stR.stats.packDensity);
chk('packDensity >= utilization(占用区不大于整板)', stR.stats.packDensity >= stR.stats.utilization - 1e-9);
chk('每张板自带 utilization/bboxArea/offcut',
  stR.sheets.every(function (s) { return typeof s.utilization === 'number' && typeof s.bboxArea === 'number' && 'offcut' in s; }));
chk('内部自由矩形表不外泄', stR.sheets.every(function (s) { return !('free' in s) && !('shelves' in s); }));

/* ============================================================
 * 10. 剩料矩形 largestFreeRect: 用暴力网格法交叉验证
 * ============================================================ */
var oneR = Nest.nest([{ part: mkp('单件', 1000, 500), qty: 1 }], so());
var oc = oneR.stats.offcut;
var op = oneR.sheets[0].placements[0];
/* 单件落在左下角 (10,10)。注意排样器会自己选服朗:
 * 1000×500 竖着放(rot 90 -> 500×1000)时, 右侧剩下 1920×1200 = 2.30e6;
 * 平着放才是 1414×1200 = 1.70e6。所以“转 90°”反而留下更大一块整料,
 * 断言不能写死服朗, 得按实际落位算期望值。 */
var rightW = (SO.margin + 2420) - (op.x + op.w), topH = (SO.margin + 1200) - (op.y + op.h);
var expW = rightW * 1200 >= 2420 * topH ? rightW : 2420;
var expH = rightW * 1200 >= 2420 * topH ? 1200 : topH;
chk('单件剩料矩形 = 较大的那块(按实际服朗算)',
  near(oc.w, expW, 0.01) && near(oc.h, expH, 0.01),
  JSON.stringify(oc) + ' want ' + expW + 'x' + expH + ' (件 ' + op.w + 'x' + op.h + ' rot' + op.rot + ')');
chk('剩料矩形面积 = 整板可用面积 - 件面积 之内',
  oc.w * oc.h <= 2420 * 1200 - op.w * op.h + 1e-6, oc.w * oc.h);
/* 暴力交叉验证: 网格法求“最大空矩形”的**严格下界**。
 *
 * 关键: 单元格必须用“整格子是否与零件相交”判占用, 而不是“中心点是否在零件内”。
 * 用中心点会把一条 6mm 宽的缝隙放大成一整格(step=10)的宽度,
 * 于是“下界”反而大于真值, 断言就会假红/假跳 ——
 * 我第一版就踩了这个坑: 贴边场景 exact=7200 而 brute=12000。
 * 改成“格子与任何零件相交就算占用”后, 每一块全空子矩形都是真空的,
 * brute <= exact 恒成立, 变成一个单边的、可信的下界检查。 */
function bruteMaxFree(sheet, cfg, step) {
  var L0 = cfg.margin, B0 = cfg.margin;
  var W = cfg.availW, H = cfg.availH;
  var nx = Math.floor(W / step), ny = Math.floor(H / step);
  var occ = [];
  for (var iy = 0; iy < ny; iy++) {
    occ.push(new Uint8Array(nx));
    for (var ix = 0; ix < nx; ix++) {
      var cx0 = L0 + ix * step, cx1 = cx0 + step;
      var cy0 = B0 + iy * step, cy1 = cy0 + step;
      var hit = sheet.placements.some(function (p) {
        return cx1 > p.x + 1e-9 && cx0 < p.x + p.w - 1e-9 &&
               cy1 > p.y + 1e-9 && cy0 < p.y + p.h - 1e-9;
      });
      occ[iy][ix] = hit ? 1 : 0;
    }
  }
  // 最大全 0 子矩形(直方图法)
  var best = 0, hgt = new Int32Array(nx);
  for (var r = 0; r < ny; r++) {
    for (var c = 0; c < nx; c++) hgt[c] = occ[r][c] ? 0 : hgt[c] + 1;
    var st = [];
    for (var c2 = 0; c2 <= nx; c2++) {
      var cur = c2 === nx ? 0 : hgt[c2];
      while (st.length && hgt[st[st.length - 1]] >= cur) {
        var top = st.pop();
        var left = st.length ? st[st.length - 1] + 1 : 0;
        best = Math.max(best, hgt[top] * (c2 - left));
      }
      st.push(c2);
    }
  }
  return best * step * step;
}
var cfgV = { margin: 10, gap: 6, availW: 2420, availH: 1200 };
var bruteCases = [
  ['单件', oneR],
  ['混合', stR],
  ['贴边', eR]
];
var ocOK = true, ocWhy = '';
bruteCases.forEach(function (bc) {
  var s0 = bc[1].sheets[0];
  var exact = Nest.largestFreeRect(s0, cfgV);
  var brute = bruteMaxFree(s0, cfgV, 5);
  var ea = exact ? exact.w * exact.h : 0;
  /* brute 是严格下界 => 精确解不得小于它(只留浮点容差) */
  if (ea < brute - 1e-6) { ocOK = false; ocWhy = bc[0] + ' exact=' + Math.round(ea) + ' < brute下界=' + Math.round(brute); }
  // 精确解也不能"凭空变大": 该矩形内不许有任何零件
  if (exact) {
    var bad = s0.placements.some(function (p) {
      return !(p.x + p.w <= exact.x + 1e-6 || p.x >= exact.x + exact.w - 1e-6 ||
               p.y + p.h <= exact.y + 1e-6 || p.y >= exact.y + exact.h - 1e-6);
    });
    if (bad) { ocOK = false; ocWhy = bc[0] + ' 剩料矩形里压着零件'; }
    if (exact.x < cfgV.margin - 1e-6 || exact.y < cfgV.margin - 1e-6 ||
        exact.x + exact.w > cfgV.margin + cfgV.availW + 1e-6 ||
        exact.y + exact.h > cfgV.margin + cfgV.availH + 1e-6) { ocOK = false; ocWhy = bc[0] + ' 剩料矩形越界'; }
  }
});
chk('剩料矩形: 精确解 >= 暴力网格下界 且 内部无零件 且 不越界', ocOK, ocWhy);
/* 空板的最大剩料 = 整个可用区 */
var emptySheet = { placements: [] };
var ef = Nest.largestFreeRect(emptySheet, cfgV);
chk('空板剩料 = 整个可用区', near(ef.w, 2420, 1e-6) && near(ef.h, 1200, 1e-6), JSON.stringify(ef));

/* ============================================================
 * 11. MaxRects 内部原语
 * ============================================================ */
var fr = { x: 0, y: 0, w: 100, h: 100 };
chk('splitFree 不相交返回 null', Nest.splitFree(fr, { x: 200, y: 200, w: 10, h: 10 }) === null);
var sp = Nest.splitFree(fr, { x: 0, y: 0, w: 40, h: 30 });
chk('splitFree 角落切出 2 块', sp.length === 2, sp.length);
var spArea = sp.reduce(function (a, q) { return a + q.w * q.h; }, 0);
chk('splitFree 覆盖剩余区域(含重叠, 面积 >= 空余)', spArea >= 100 * 100 - 40 * 30 - 1e-6, spArea);
var spMid = Nest.splitFree(fr, { x: 30, y: 30, w: 40, h: 40 });
chk('splitFree 居中切出 4 块', spMid.length === 4, spMid.length);
chk('splitFree 各块都不含 used 区域', spMid.every(function (q) {
  return q.x + q.w <= 30 + 1e-6 || q.x >= 70 - 1e-6 || q.y + q.h <= 30 + 1e-6 || q.y >= 70 - 1e-6;
}));
/* pruneFree: 完全相同的两块必须只留一块(而不是双双被判死) */
var pr = Nest.pruneFree([{ x: 0, y: 0, w: 50, h: 50 }, { x: 0, y: 0, w: 50, h: 50 }]);
chk('pruneFree 等大重复留 1 块(不得清零)', pr.length === 1, pr.length);
var pr2 = Nest.pruneFree([{ x: 0, y: 0, w: 100, h: 100 }, { x: 10, y: 10, w: 20, h: 20 }]);
chk('pruneFree 剪掉被包含的小块', pr2.length === 1 && pr2[0].w === 100, pr2.length);
var pr3 = Nest.pruneFree([{ x: 0, y: 0, w: 100, h: 10 }, { x: 0, y: 0, w: 10, h: 100 }]);
chk('pruneFree 互不包含则都保留', pr3.length === 2, pr3.length);
chk('pruneFree 丢掉零面积块', Nest.pruneFree([{ x: 0, y: 0, w: 0, h: 50 }, { x: 0, y: 0, w: 30, h: 30 }]).length === 1);

/* ============================================================
 * 12. 确定性与鲁棒性
 * ============================================================ */
var d1 = Nest.nest(mix, so()), d2 = Nest.nest(mix, so());
chk('同输入结果确定(可复现)',
  JSON.stringify(d1.sheets.map(function (s) { return s.placements.map(function (p) { return [p.name, p.x, p.y, p.rot]; }); })) ===
  JSON.stringify(d2.sheets.map(function (s) { return s.placements.map(function (p) { return [p.name, p.x, p.y, p.rot]; }); })));
/* 输入顺序打乱不该改变板材张数(排序口径已把顺序归一化) */
var shuffled = mix.slice().reverse();
chk('输入顺序打乱张数不变', Nest.nest(shuffled, so()).stats.sheetCount === d1.stats.sheetCount);
/* 未知策略名 -> 退回默认, 不许产出空排样 */
var badStrat = Nest.nest(mix, so({ strategy: 'nonexistent/xyz' }));
chk('未知策略名退回默认而非空排样', badStrat.sheets.length >= 1 && badStrat.stats.strategy === 'area/baf', badStrat.stats.strategy);
chk('退回默认时排样依然合法', Nest.verify(badStrat, so()).length === 0);
/* 极小零件 / 极端长宽比 */
var tiny = Nest.nest(items([['微件', 5, 5, 40]]), so());
chk('极小零件排样合法', Nest.verify(tiny, so()).length === 0 && tiny.stats.sheetCount === 1);
var thin = Nest.nest(items([['细条', 2400, 8, 12]]), so());
chk('极细长条排样合法', Nest.verify(thin, so()).length === 0, thin.stats.sheetCount);
/* 恰好等于可用区的整板件 */
var exact1 = Nest.nest(items([['整板', 2420, 1200]]), so());
chk('恰好等于可用区的件放得下', exact1.oversize.length === 0 && exact1.sheets.length === 1);
chk('整板件紧凑度 = 1', near(exact1.stats.packDensity, 1, 1e-9), exact1.stats.packDensity);

/* ============================================================
 * 13. 性能: 300 件必须在交互可接受时间内完成
 * ============================================================ */
var big = [];
for (var z = 0; z < 300; z++) big.push({ part: mkp('S' + z, 200 + (z % 7) * 30, 150 + (z % 5) * 40), qty: 1 });
var t0 = performance.now();
var bigR = Nest.nest(big, so());
var dt = performance.now() - t0;
chk('300 件排样 < 3000ms', dt < 3000, Math.round(dt) + 'ms');
chk('300 件时自动缩减策略集', bigR.stats.strategiesTried === 6, bigR.stats.strategiesTried);
chk('300 件排样合法', Nest.verify(bigR, so()).length === 0);
var placedBig = 0; bigR.sheets.forEach(function (s) { placedBig += s.placements.length; });
chk('300 件全部排入', placedBig === 300, placedBig);

} catch (e) { L.push('FAIL exception: ' + e.message + '\n' + (e.stack || '')); }
var fails = L.filter(function (s) { return s.indexOf('FAIL') === 0; }).length;
document.getElementById('out').textContent = L.join('\n') + '\n---\nTOTAL ' + L.length + '  FAILS ' + fails;
</script>
